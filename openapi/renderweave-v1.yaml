    post:
      operationId: restoreAssetContent
      tags: [Assets]
      summary: Append a new content version that reuses an exact historical version's bytes
      description: >-
        The historical Blob is reused as-is (no re-admission, no capacity charge) and a new
        immutable content version is appended, switching current. Restoring the current content
        version succeeds as a no-op. Historical versions are never rewritten or removed.
      parameters:
        - $ref: '#/components/parameters/AssetExpectedAssetRevision'
        - $ref: '#/components/parameters/AssetSourceContentVersion'
      responses:
        '200':
          description: The historical content restored as the new current content version (or a no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReadableResponse'
        '400':
