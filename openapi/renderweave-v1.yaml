      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getAssetCurrent
      tags: [Assets]
      summary: Read the ACTIVE Asset detail with its current content version
      responses:
        '200':
          description: Current Asset detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReadableResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/AssetForbiddenProblem'
        '404':
          $ref: '#/components/responses/AssetNotFoundProblem'
        '410':
          description: The authorized Asset exists but is terminally deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/AssetServiceUnavailableProblem'
    delete:
      operationId: deleteAsset
      tags: [Assets]
      summary: Soft-delete the ACTIVE Asset with a single-use confirmation token
      description: >-
        Deletes the Asset only when the confirmation token from the delete precheck is
        still valid: the token must be unused, unexpired and bind the same actor, owner
        scope, Asset id, Asset revision and complete reference fingerprint. The delete
        takes the exclusive Asset reservation and re-derives the reference proof inside
        the same transaction; any drift is rejected with zero writes and the caller must
        run the delete precheck again. Deleting never revokes issued fetch leases.
        Templates referencing the Asset are marked STALE and rechecked to INVALID by the
        Template dependency projection consumer.
      parameters:
        - $ref: '#/components/parameters/AssetConfirmationToken'
      responses:
        '200':
          description: The Asset is soft-deleted (lifecycle DELETED, revision advanced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReadableResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/AssetForbiddenProblem'
        '404':
          $ref: '#/components/responses/AssetNotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/AssetServiceUnavailableProblem'
  /api/v1/assets/{assetId}/delete-precheck:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      operationId: precheckDeleteAsset
      tags: [Assets]
      summary: Resolve the delete impact and issue a 5-minute single-use confirmation token
      description: >-
        Returns the current-only Template reference impact (total count, the Template ids
        the caller may read, and the redacted count) and issues a single-use confirmation
        token valid for 5 minutes. The token binds the actor, owner scope, Asset id, the
        exact Asset revision and a fingerprint over the complete reference set; any of
        these facts drifting before the delete rejects the delete with zero writes.
      responses:
        '200':
          description: Impact report and a single-use confirmation token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDeletePrecheckResponse'
        '403':
          $ref: '#/components/responses/AssetForbiddenProblem'
        '404':
          $ref: '#/components/responses/AssetNotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/AssetServiceUnavailableProblem'
  /api/v1/assets/{assetId}/restore-lifecycle:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      operationId: restoreAssetLifecycle
      tags: [Assets]
      summary: Reactivate a DELETED Asset at its pre-delete current content version
      description: >-
        Restores the Asset lifecycle to ACTIVE with the same Asset id and the pre-delete
        current content version; no new content version is created. The request carries
        expectedAssetRevision. Templates referencing the Asset are marked STALE and
        rechecked to READY/INVALID by the Template dependency projection consumer.
      parameters:
        - $ref: '#/components/parameters/AssetExpectedAssetRevision'
      responses:
        '200':
          description: The Asset is reactivated (lifecycle ACTIVE, revision advanced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReadableResponse'
        '400':
