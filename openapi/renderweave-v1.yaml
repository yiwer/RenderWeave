        inputClassification:
          type: string
          const: USER_PROVIDED
        runCostLimitRequired:
          type: boolean
          const: true
        maximumRunCostLimitMicrosCny:
          type: integer
          format: int64
          const: 5000000
        profiles:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/LiveProfileResponse'
    LiveProfileResponse:
      type: object
      additionalProperties: false
      required:
        [profileId, provider, model, certification, available, unavailabilityCode,
         supportedModes, maximumTotalCalls, maximumOutputTokens,
         maximumEstimatedCostMicrosCny, pricingEffectiveDate]
      properties:
        profileId:
          type: string
          enum:
            [dashscope-qwen37-plus-product-v45-hybrid-generic,
             dashscope-qwen38-max-product-v45-hybrid-generic,
             dashscope-qwen37-flash-product-v45-hybrid-generic]
        provider:
