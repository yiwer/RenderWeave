  /api/v1/assets/{assetId}/content:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - $ref: '#/components/parameters/AssetExpectedAssetRevision'
    put:
      operationId: replaceAssetContent
      tags: [Assets]
      summary: Append the admitted bytes as a new content version and advance current
      description: >-
        The raw content bytes are the complete request body; the Asset kind is permanent and the
        replacement must pass the same acceptance authority. When the admitted content is
        byte-identical to the current content version the replace succeeds as a no-op without
        advancing the Asset revision or emitting audit/STALE facts. A new Blob is only stored when
        the deployment capacity watermark allows it; reusing an existing Blob never counts against
        the watermark.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The next immutable content version committed (or a no-op when content is unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReadableResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/AssetForbiddenProblem'
        '404':
          $ref: '#/components/responses/AssetNotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/AssetPayloadTooLargeProblem'
        '415':
          description: The body is not application/octet-stream.
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '507':
          $ref: '#/components/responses/AssetCapacityExceededProblem'
        '503':
