openapi: 3.1.2
info:
  title: RenderWeave API
  version: 0.9.0
  description: >-
    Contract-first API for RenderWeave Schema Drafts, immutable StaticSchemas,
    exact compiled artifacts, authoritative RootDocument validation, deterministic replay,
    guarded live inference Candidate review and create-only atomic Draft application.
servers:
  - url: /
tags:
  - name: System
    description: Operational endpoints used by local and deployment canaries.
  - name: Schema Drafts
    description: Mutable Schema definitions with append-only revisions.
  - name: Static Schemas
    description: Immutable, exact-version publication artifacts and system presets.
  - name: RootDocument Validation
    description: Strict, deterministic batch validation against one frozen Schema graph.
  - name: Inference Runs
    description: Durable replay/live runs and optimistic Candidate review.
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Verify API and PostgreSQL readiness
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts:
    get:
      operationId: listDrafts
      tags: [Schema Drafts]
      summary: Page through active Schema Drafts, most recently updated first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ResourceSearch'
        - $ref: '#/components/parameters/DraftListSort'
      responses:
        '200':
          description: Active Draft summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftListResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    post:
      operationId: createDraft
      tags: [Schema Drafts]
      summary: Create a valid Schema Draft at revision 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              description: Canonical URL of the created Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    get:
      operationId: getDraft
      tags: [Schema Drafts]
      summary: Read the current saved revision of a Draft
      responses:
        '200':
          description: Current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    put:
      operationId: saveDraft
      tags: [Schema Drafts]
      summary: Append a complete Draft revision when expectedRevision is current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: New current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    delete:
      operationId: deleteDraft
      tags: [Schema Drafts]
      summary: Soft-delete an unreferenced Draft at the expected revision
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Draft soft-deleted and its outgoing projection deactivated.
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/revisions:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    get:
      operationId: listDraftRevisions
      tags: [Schema Drafts]
      summary: Page through immutable Draft revision summaries, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Revision summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/revisions/{revision}:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
      - $ref: '#/components/parameters/Revision'
    get:
      operationId: getDraftRevision
      tags: [Schema Drafts]
      summary: Read one immutable Draft revision, including for a deleted Draft
      responses:
        '200':
          description: Exact historical revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftRevisionResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/restore:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    post:
      operationId: restoreDraftRevision
      tags: [Schema Drafts]
      summary: Copy an old revision into a new active current revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDraftRequest'
      responses:
        '200':
          description: New current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/copies:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    post:
      operationId: copyDraft
      tags: [Schema Drafts]
      summary: Copy the observed current Draft into a new user Draft at revision 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDraftRequest'
      responses:
        '201':
          description: Draft copy created.
          headers:
            Location:
              description: Canonical URL of the new Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas:
    get:
      operationId: listStaticSchemas
      tags: [Static Schemas]
      summary: List immutable StaticSchemas, including system presets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ResourceSearch'
        - $ref: '#/components/parameters/StaticSchemaListSort'
        - $ref: '#/components/parameters/StaticSchemaOriginFilter'
      responses:
        '200':
          description: StaticSchema summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaListResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    post:
      operationId: publishStaticSchema
      tags: [Static Schemas]
      summary: Publish the exact current Draft revision as an immutable StaticSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishStaticSchemaRequest'
      responses:
        '201':
          description: StaticSchema published with a stored compiled artifact.
          headers:
            Location:
              description: Canonical URL of the StaticSchema.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: getStaticSchema
      tags: [Static Schemas]
      summary: Read immutable StaticSchema metadata and DSL snapshot
      responses:
        '200':
          description: StaticSchema detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/definition:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: downloadStaticSchemaDefinition
      tags: [Static Schemas]
      summary: Download the immutable RenderWeave DSL snapshot
      responses:
        '200':
          description: Normalized RenderWeave DSL JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/compiled-json-schema:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: downloadCompiledJsonSchema
      tags: [Static Schemas]
      summary: Download the exact stored JSON Schema 2020-12 artifact bytes
      responses:
        '200':
          description: Fully inlined immutable JSON Schema artifact.
          content:
            application/schema+json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/copies:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    post:
      operationId: copyStaticSchemaToDraft
      tags: [Static Schemas]
      summary: Copy one exact StaticSchema definition into a new user Draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDraftRequest'
      responses:
        '201':
          description: New Draft at revision 0.
          headers:
            Location:
              description: Canonical URL of the new Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/root-document-validations:
    post:
      operationId: validateRootDocuments
      tags: [RootDocument Validation]
      summary: Validate 1–20 RootDocuments against one frozen Draft or exact StaticSchema graph
      description: >-
        The raw body is parsed as strict JSON with duplicate-name detection before
        Schema validation. Unknown RootDocument fields are accepted. The response
        includes the root-inclusive exact resolution snapshot used for every document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootDocumentValidationRequest'
      responses:
        '200':
          description: Deterministic per-document results in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/replay-fixtures:
    get:
      operationId: listReplayFixtures
      tags: [Inference Runs]
      summary: List the versioned synthetic fixtures available to replay-v1
      responses:
        '200':
          description: Exactly 60 synthetic cases, balanced across the three modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayFixtureListResponse'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/live-availability:
    get:
      operationId: getLiveInferenceAvailability
      tags: [Inference Runs]
      summary: Read product DashScope profiles and deployment availability
      responses:
        '200':
          description: Safe availability metadata; credentials are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveAvailabilityResponse'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/live:
    post:
      operationId: createLiveInferenceRun
      tags: [Inference Runs]
      summary: Queue an explicitly confirmed DashScope inference run
      description: >-
        Worker execution, multipart upload and provider credentials are independent deployment
        gates. A nullable run cost limit is cumulative across all attempts; null means no additional
        per-run limit. Every call still has a conservative Profile bound, a three-call ceiling and a
        durable pre-call reservation. Bounded PNG/JPEG source images are normalized to a maximum
        4096-pixel long edge before the durable run is queued.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata]
              properties:
                metadata:
                  $ref: '#/components/schemas/CreateLiveRunRequest'
                images:
                  type: array
                  maxItems: 10
                  description: >-
                    PNG/JPEG source images; each source is at most 10 MiB, 65535 pixels on its long
                    edge and 268435456 total pixels, then normalized to a maximum 4096-pixel long edge.
                  items:
                    type: string
                    format: binary
                jsonSamples:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: Durable live run queued.
          headers:
            Location:
              description: Canonical URL of the inference run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '200':
          description: Idempotent replay of the same upload request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs:
    get:
      operationId: listInferenceRuns
      tags: [Inference Runs]
      summary: List durable inference runs newest first without loading input or Candidate payloads
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: A bounded page of resumable inference run summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    post:
      operationId: createReplayInferenceRun
      tags: [Inference Runs]
      summary: Create and deterministically execute a durable synthetic replay run
      description: >-
        P4 exposes only replay-v1. The selected fixture is synthetic and the profile has
        networkAllowed=false. Idempotent replays return the original run.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplayRunRequest'
      responses:
        '201':
          description: Durable replay run created and executed.
          headers:
            Location:
              description: Canonical URL of the inference run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '200':
          description: Idempotent replay of the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
    get:
      operationId: getInferenceRun
      tags: [Inference Runs]
      summary: Read the authoritative durable run snapshot
      responses:
        '200':
          description: Current run state and monotonic sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/execution-log:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
    get:
      operationId: getInferenceExecutionLog
      tags: [Inference Runs]
      summary: Read the payload-free structured execution log for a run
      description: >-
        Returns durable state events and bounded Provider attempt telemetry. It deliberately omits
        images, prompts, model output, chain-of-thought and Provider request identifiers. At most
        1000 state events are returned; truncated is true when a longer history exists.
      responses:
        '200':
          description: Structured run progress, attempts, cost and validation-problem counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceExecutionLogResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/candidate:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
    get:
      operationId: getInferenceCandidate
      tags: [Inference Runs]
      summary: Read original and current Candidate review snapshots
      responses:
        '200':
          description: Candidate, evidence inputs and deterministic review problems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    put:
      operationId: saveInferenceCandidate
      tags: [Inference Runs]
      summary: Autosave one optimistic Candidate review action
      description: >-
        AI provenance is immutable. A request may change at most one item resolution;
        there is deliberately no confirm-all operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCandidateRequest'
      responses:
        '200':
          description: Current snapshot saved at the next Candidate revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/apply:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
    post:
      operationId: applyInferenceCandidate
      tags: [Inference Runs]
      summary: Atomically create every Draft in a fully reviewed Candidate bundle
      description: >-
        Create-only and idempotent for the frozen Candidate revision. Any active key,
        tombstone, missing reference, graph conflict or transaction fault leaves the
        entire bundle unwritten and the run in REVIEW_REQUIRED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCandidateRequest'
      responses:
        '200':
          description: The complete Draft bundle exists at revision zero with creationSource AI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateApplyResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
    post:
      operationId: cancelInferenceRun
      tags: [Inference Runs]
      summary: Request cancellation under the durable run state machine
      description: Applying transactions cannot be cancelled.
      responses:
        '200':
          description: Authoritative run state after the cancellation request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/retries:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: retryInferenceRun
      tags: [Inference Runs]
      summary: Create a new run from retained normalized inputs of a failed or cancelled run
      description: >-
        Replay retries remain local. A retry of a live Profile requires the same independently
        enabled worker, multipart data-transfer authorization and provider credential as a new live run.
      responses:
        '201':
          description: A new auditable retry run was created.
          headers:
            Location:
              description: Canonical URL of the new inference run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '200':
          description: Idempotent replay of the same retry request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRunResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: '^[0-9]+$'
      - name: afterSequence
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      operationId: streamInferenceRunEvents
      tags: [Inference Runs]
      summary: Stream at-least-once run notifications after a monotonic sequence
      description: Clients deduplicate by SSE id and then GET the authoritative run or Candidate snapshot.
      responses:
        '200':
          description: SSE notifications; each data payload conforms to InferenceEvent.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
      - $ref: '#/components/parameters/InferenceArtifactId'
    get:
      operationId: getInferenceImageArtifact
      tags: [Inference Runs]
      summary: Read a normalized image that belongs to this run for evidence review
      responses:
        '200':
          description: Metadata-free normalized PNG.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    InferenceRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InferenceArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    SchemaKey:
      name: schemaKey
      in: path
      required: true
      description: Stable Draft identity. The reserved system- prefix is not valid for user Drafts.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    ExpectedRevision:
      name: expectedRevision
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive substring matched against the resource identity and display name.
      schema:
        type: string
        maxLength: 128
        default: ''
    DraftListSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [UPDATED_DESC, UPDATED_ASC, NAME_ASC, NAME_DESC]
        default: UPDATED_DESC
    StaticSchemaListSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [PUBLISHED_DESC, PUBLISHED_ASC, NAME_ASC, NAME_DESC]
        default: PUBLISHED_DESC
    StaticSchemaOriginFilter:
      name: origin
      in: query
      required: false
      schema:
        type: string
        enum: [ALL, DRAFT, SYSTEM]
        default: ALL
    StaticSchemaKey:
      name: schemaKey
      in: path
      required: true
      description: User or reserved system StaticSchema key.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    VersionTag:
      name: versionTag
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  schemas:
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, status, database, contractVersion]
      properties:
        service:
          type: string
          const: renderweave-api
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [ready]
        contractVersion:
          type: string
          const: 0.9.0
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, definition]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, definition]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
    RestoreDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, sourceRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        sourceRevision:
          type: integer
          format: int64
          minimum: 0
    CopyDraftRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, displayName]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    PublishStaticSchemaRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, expectedRevision, versionTag]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        versionTag:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        releaseNote:
          type: string
    DraftResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - revision
        - definition
        - creationSource
        - createdAt
        - updatedAt
        - savedAt
        - resolvedRevisions
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        creationSource:
          type: string
          enum: [USER, AI]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
        resolvedRevisions:
          type: object
          description: Root-inclusive request snapshot of live Draft revisions.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    DraftListResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    DraftSummary:
      type: object
      additionalProperties: false
      required: [schemaKey, revision, creationSource, displayName, fieldCount, createdAt, updatedAt, savedAt]
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        creationSource:
          type: string
          enum: [USER, AI]
        displayName:
          type: string
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
    DraftHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftRevisionSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    DraftRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, displayName, fieldCount, savedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        displayName:
          type: string
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        savedAt:
          type: string
          format: date-time
    DraftRevisionResponse:
      type: object
      additionalProperties: false
      required: [schemaKey, revision, definition, savedAt]
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        savedAt:
          type: string
          format: date-time
    StaticSchemaResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - versionTag
        - origin
        - sourceDraftRevision
        - definition
        - compilerVersion
        - releaseNote
        - referenceDepth
        - publishedAt
      properties:
        schemaKey:
          type: string
        versionTag:
          type: string
        origin:
          type: string
          enum: [DRAFT, SYSTEM]
        sourceDraftRevision:
          type: [integer, 'null']
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        compilerVersion:
          type: string
        releaseNote:
          type: [string, 'null']
        referenceDepth:
          type: integer
          minimum: 1
          maximum: 16
        publishedAt:
          type: string
          format: date-time
    StaticSchemaListResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaticSchemaSummaryResponse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    StaticSchemaSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - versionTag
        - origin
        - displayName
        - fieldCount
        - referenceDepth
        - publishedAt
      properties:
        schemaKey: { type: string }
        versionTag: { type: string }
        origin:
          type: string
          enum: [DRAFT, SYSTEM]
        displayName: { type: string }
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        referenceDepth:
          type: integer
          minimum: 1
          maximum: 16
        publishedAt:
          type: string
          format: date-time
    SchemaDefinition:
      type: object
      additionalProperties: false
      required: [dslVersion, displayName, fields]
      properties:
        dslVersion:
          type: string
          const: renderweave-schema/1.0
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        fields:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/SchemaField'
    SchemaField:
      type: object
      additionalProperties: false
      required: [fieldKey, required, value]
      properties:
        fieldKey:
          type: string
          minLength: 1
          x-renderweave-max-utf8-bytes: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        required:
          type: boolean
        value:
          $ref: '#/components/schemas/ValueDescriptor'
    ValueDescriptor:
      oneOf:
        - $ref: '#/components/schemas/TextValue'
        - $ref: '#/components/schemas/DecimalValue'
        - $ref: '#/components/schemas/DateValue'
        - $ref: '#/components/schemas/TimeValue'
        - $ref: '#/components/schemas/BooleanValue'
        - $ref: '#/components/schemas/ReferenceValue'
        - $ref: '#/components/schemas/ArrayValue'
    TextValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: text
        constraints:
          $ref: '#/components/schemas/TextConstraints'
    TextConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minLength:
          type: integer
          minimum: 0
          maximum: 65536
        maxLength:
          type: integer
          minimum: 0
          maximum: 65536
        pattern:
          type: string
          maxLength: 1024
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
        const:
          type: string
    DecimalValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: decimal
        constraints:
          $ref: '#/components/schemas/DecimalConstraints'
    DecimalConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { type: number }
        exclusiveMin: { type: number }
        max: { type: number }
        exclusiveMax: { type: number }
        multipleOf: { type: number, exclusiveMinimum: 0 }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: number }
        const: { type: number }
    DateValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: date }
        constraints:
          $ref: '#/components/schemas/DateConstraints'
    DateConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { $ref: '#/components/schemas/DateLiteral' }
        exclusiveMin: { $ref: '#/components/schemas/DateLiteral' }
        max: { $ref: '#/components/schemas/DateLiteral' }
        exclusiveMax: { $ref: '#/components/schemas/DateLiteral' }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/DateLiteral' }
        const: { $ref: '#/components/schemas/DateLiteral' }
    DateLiteral:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    TimeValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: time }
        constraints:
          $ref: '#/components/schemas/TimeConstraints'
    TimeConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { $ref: '#/components/schemas/TimeLiteral' }
        exclusiveMin: { $ref: '#/components/schemas/TimeLiteral' }
        max: { $ref: '#/components/schemas/TimeLiteral' }
        exclusiveMax: { $ref: '#/components/schemas/TimeLiteral' }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/TimeLiteral' }
        const: { $ref: '#/components/schemas/TimeLiteral' }
    TimeLiteral:
      type: string
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
    BooleanValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: boolean }
        constraints:
          $ref: '#/components/schemas/BooleanConstraints'
    BooleanConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        const: { type: boolean }
    ReferenceValue:
      type: object
      additionalProperties: false
      required: [type, ref]
      properties:
        type: { type: string, const: reference }
        ref:
          $ref: '#/components/schemas/SchemaReference'
    SchemaReference:
      oneOf:
        - $ref: '#/components/schemas/SchemaRef'
        - $ref: '#/components/schemas/StaticSchemaRef'
    SchemaRef:
      type: object
      additionalProperties: false
      required: [schemaKey]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    StaticSchemaRef:
      type: object
      additionalProperties: false
      required: [schemaKey, versionTag]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        versionTag:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    ArrayValue:
      type: object
      additionalProperties: false
      required: [type, items]
      properties:
        type: { type: string, const: array }
        constraints:
          $ref: '#/components/schemas/ArrayConstraints'
        items:
          oneOf:
            - $ref: '#/components/schemas/TextValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/TimeValue'
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/ReferenceValue'
    ArrayConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minItems:
          type: integer
          minimum: 0
          maximum: 10000
        maxItems:
          type: integer
          minimum: 0
          maximum: 10000
        uniqueItems:
          type: boolean
    RootDocumentValidationRequest:
      type: object
      additionalProperties: false
      required: [target, documents]
      properties:
        target:
          $ref: '#/components/schemas/ValidationTarget'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/RootDocumentEnvelope'
    ValidationTarget:
      oneOf:
        - $ref: '#/components/schemas/DraftValidationTarget'
        - $ref: '#/components/schemas/StaticValidationTarget'
      discriminator:
        propertyName: kind
        mapping:
          draft: '#/components/schemas/DraftValidationTarget'
          static: '#/components/schemas/StaticValidationTarget'
    DraftValidationTarget:
      type: object
      additionalProperties: false
      required: [kind, schemaKey]
      properties:
        kind:
          type: string
          enum: [draft]
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    StaticValidationTarget:
      type: object
      additionalProperties: false
      required: [kind, schemaKey, versionTag]
      properties:
        kind:
          type: string
          enum: [static]
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        versionTag:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    RootDocumentEnvelope:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: {}
    ValidationBatchResponse:
      type: object
      additionalProperties: false
      required: [target, resolvedSchemas, summary, documents]
      properties:
        target:
          $ref: '#/components/schemas/ResolvedSchema'
        resolvedSchemas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResolvedSchema'
          description: Root-first, first-occurrence depth-first exact resolution snapshot.
        summary:
          $ref: '#/components/schemas/ValidationSummary'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/DocumentValidationResult'
    ResolvedSchema:
      oneOf:
        - $ref: '#/components/schemas/ResolvedDraftSchema'
        - $ref: '#/components/schemas/ResolvedStaticSchema'
      discriminator:
        propertyName: kind
        mapping:
          draft: '#/components/schemas/ResolvedDraftSchema'
          static: '#/components/schemas/ResolvedStaticSchema'
    ResolvedDraftSchema:
      type: object
      additionalProperties: false
      required: [kind, schemaKey, revision]
      properties:
        kind:
          type: string
          enum: [draft]
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
    ResolvedStaticSchema:
      type: object
      additionalProperties: false
      required: [kind, schemaKey, versionTag]
      properties:
        kind:
          type: string
          enum: [static]
        schemaKey:
          type: string
        versionTag:
          type: string
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [total, valid, invalid]
      properties:
        total:
          type: integer
          minimum: 1
          maximum: 20
        valid:
          type: integer
          minimum: 0
          maximum: 20
        invalid:
          type: integer
          minimum: 0
          maximum: 20
    DocumentValidationResult:
      type: object
      additionalProperties: false
      required: [index, valid, problems, truncated]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 19
        valid:
          type: boolean
        problems:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RootDocumentValidationProblem'
        truncated:
          type: boolean
    RootDocumentValidationProblem:
      type: object
      additionalProperties: false
      required: [code, instancePath, schemaPath, messageArgs]
      properties:
        code:
          type: string
        instancePath:
          type: string
          description: RFC 6901 pointer from the RootDocument root.
        schemaPath:
          type: string
          description: Pointer containing the exact resolved Schema identity and DSL location.
        messageArgs:
          type: object
          additionalProperties: true
          description: Language-neutral arguments; clients localize by code.
    CreateReplayRunRequest:
      type: object
      additionalProperties: false
      required: [fixtureId, externalTransferConfirmed]
      properties:
        fixtureId:
          type: string
          minLength: 1
          maxLength: 128
        externalTransferConfirmed:
          type: boolean
          const: true
          description: Explicit acknowledgement of the displayed profile and input scope.
    CreateLiveRunRequest:
      type: object
      additionalProperties: false
      required:
        [profileId, mode, inputClassification, externalTransferConfirmed, experimentalProfileConfirmed]
      properties:
        profileId:
          type: string
          enum:
            [dashscope-qwen37-flash-product-v3, dashscope-qwen37-plus-product-v3,
             dashscope-qwen38-max-product-v3,
             dashscope-qwen37-max-20260608-product-v3]
        mode:
          $ref: '#/components/schemas/InferenceMode'
        inputClassification:
          type: string
          const: USER_PROVIDED
        externalTransferConfirmed:
          type: boolean
          const: true
        experimentalProfileConfirmed:
          type: boolean
          const: true
        costLimitMicrosCny:
          type: [integer, 'null']
          format: int64
          minimum: 1
          maximum: 100000000
          description: Optional cumulative ceiling for this run; null applies no additional run ceiling.
    LiveAvailabilityResponse:
      type: object
      additionalProperties: false
      required:
        [enabled, configured, uploadEnabled, inputClassification, runCostLimitRequired,
         maximumRunCostLimitMicrosCny, profiles]
      properties:
        enabled:
          type: boolean
        configured:
          type: boolean
        uploadEnabled:
          type: boolean
          description: False until multipart transfer is enabled for this deployment.
        inputClassification:
          type: string
          const: USER_PROVIDED
        runCostLimitRequired:
          type: boolean
          const: false
        maximumRunCostLimitMicrosCny:
          type: integer
          format: int64
          const: 100000000
        profiles:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/LiveProfileResponse'
    LiveProfileResponse:
      type: object
      additionalProperties: false
      required:
        [profileId, provider, model, certification, supportedModes, maximumTotalCalls,
         maximumOutputTokens, maximumEstimatedCostMicrosCny, pricingEffectiveDate]
      properties:
        profileId:
          type: string
          enum:
            [dashscope-qwen37-flash-product-v3, dashscope-qwen37-plus-product-v3,
             dashscope-qwen38-max-product-v3,
             dashscope-qwen37-max-20260608-product-v3]
        provider:
          type: string
          const: DASHSCOPE
        model:
          type: string
          enum: [qwen3.7-flash, qwen3.7-plus, qwen3.8-max, qwen3.7-max-2026-06-08]
        certification:
          type: string
          const: EXPERIMENTAL
        supportedModes:
          type: array
          items:
            $ref: '#/components/schemas/InferenceMode'
        maximumTotalCalls:
          type: integer
          minimum: 1
          maximum: 5
        maximumOutputTokens:
          type: integer
          minimum: 1
        maximumEstimatedCostMicrosCny:
          type: integer
          format: int64
          const: 2000000
          description: Conservative per-provider-call reservation ceiling (¥2).
        pricingEffectiveDate:
          type: string
          format: date
    ReplayFixtureListResponse:
      type: object
      additionalProperties: false
      required: [profileId, provider, networkAllowed, certification, items]
      properties:
        profileId:
          type: string
          const: replay-v1
        provider:
          type: string
          const: REPLAY
        networkAllowed:
          type: boolean
          const: false
        certification:
          type: string
          const: REPLAY_ONLY
        items:
          type: array
          minItems: 60
          maxItems: 60
          items:
            $ref: '#/components/schemas/ReplayFixtureResponse'
    ReplayFixtureResponse:
      type: object
      additionalProperties: false
      required:
        [fixtureId, mode, scenario, imageCount, jsonSampleCount, expectedSchemaCount, expectedProblemCodes]
      properties:
        fixtureId:
          type: string
        mode:
          $ref: '#/components/schemas/InferenceMode'
        scenario:
          type: string
        imageCount:
          type: integer
          minimum: 0
          maximum: 10
        jsonSampleCount:
          type: integer
          minimum: 0
          maximum: 20
        expectedSchemaCount:
          type: integer
          minimum: 1
        expectedProblemCodes:
          type: array
          items:
            type: string
    InferenceMode:
      type: string
      enum: [IMAGE_ONLY, JSON_ONLY, COMBINED]
    InferenceRunState:
      type: string
      enum: [QUEUED, RUNNING, REVIEW_REQUIRED, APPLYING, COMPLETED, FAILED, CANCELLED]
    InferenceStage:
      type: string
      enum:
        [NORMALIZE, OBSERVE, HIERARCHY, ELEMENT_BINDING, STRUCTURE,
         DETERMINISTIC_VALIDATE, CRITIQUE, REPAIR, USER_APPROVAL, ATOMIC_CREATE]
    InferenceRunResponse:
      type: object
      additionalProperties: false
      required:
        [runId, mode, state, stage, sequence, profileId, sourceReference, costLimitMicrosCny,
         cancellationRequested, retryOfRunId, failureCode, candidateRevision, createdAt, updatedAt, finishedAt]
      properties:
        runId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/InferenceMode'
        state:
          $ref: '#/components/schemas/InferenceRunState'
        stage:
          $ref: '#/components/schemas/InferenceStage'
        sequence:
          type: integer
          format: int64
          minimum: 1
        profileId:
          type: string
        sourceReference:
          type: string
        costLimitMicrosCny:
          type: [integer, 'null']
          format: int64
          minimum: 1
        cancellationRequested:
          type: boolean
        retryOfRunId:
          type: [string, 'null']
          format: uuid
        failureCode:
          type: [string, 'null']
        candidateRevision:
          type: [integer, 'null']
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    InferenceRunPageResponse:
      type: object
      additionalProperties: false
      required: [page, size, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 20
        total:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InferenceRunResponse'
    InferenceExecutionLogResponse:
      type: object
      additionalProperties: false
      required: [run, events, attempts, truncated]
      properties:
        run:
          $ref: '#/components/schemas/InferenceRunResponse'
        events:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/InferenceExecutionEvent'
        attempts:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InferenceAttempt'
        truncated:
          type: boolean
    InferenceExecutionEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, state, stage, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
        state:
          $ref: '#/components/schemas/InferenceRunState'
        stage:
          $ref: '#/components/schemas/InferenceStage'
        occurredAt:
          type: string
          format: date-time
    InferenceAttempt:
      type: object
      additionalProperties: false
      required:
        [attemptOrdinal, stage, status, outcomeCode, providerModel, inputTokens, outputTokens,
         costMicrosCny, durationMillis, problemCodeCounts, completedAt]
      properties:
        attemptOrdinal:
          type: integer
          minimum: 0
          maximum: 4
        stage:
          type: string
          enum: [OBSERVE, HIERARCHY, ELEMENT_BINDING, STRUCTURE, REPAIR]
        status:
          type: string
          enum: [SUCCEEDED, REJECTED, FAILED]
        outcomeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,127}$'
        providerModel:
          type: [string, 'null']
          maxLength: 128
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        costMicrosCny:
          type: integer
          format: int64
          minimum: 0
        durationMillis:
          type: integer
          format: int64
          minimum: 0
        problemCodeCounts:
          type: object
          maxProperties: 64
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 10000
        completedAt:
          type: string
          format: date-time
    SaveCandidateRequest:
      type: object
      additionalProperties: false
      required: [expectedCandidateRevision, candidate]
      properties:
        expectedCandidateRevision:
          type: integer
          format: int64
          minimum: 0
        candidate:
          $ref: '#/components/schemas/CandidateBundle'
    ApplyCandidateRequest:
      type: object
      additionalProperties: false
      required: [expectedCandidateRevision]
      properties:
        expectedCandidateRevision:
          type: integer
          format: int64
          minimum: 0
    CandidateApplyResponse:
      type: object
      additionalProperties: false
      required: [run, candidateRevision, rootSchemaKey, createdDrafts, appliedAt]
      properties:
        run:
          $ref: '#/components/schemas/InferenceRunResponse'
        candidateRevision:
          type: integer
          format: int64
          minimum: 0
        rootSchemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        createdDrafts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreatedDraft'
        appliedAt:
          type: string
          format: date-time
    CreatedDraft:
      type: object
      additionalProperties: false
      required: [schemaKey, revision, href]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        revision:
          type: integer
          format: int64
          const: 0
        href:
          type: string
          format: uri-reference
    CandidateReviewResponse:
      type: object
      additionalProperties: false
      required: [run, candidateRevision, original, current, problems, finalCandidate, appliedAt, images, jsonSampleCount]
      properties:
        run:
          $ref: '#/components/schemas/InferenceRunResponse'
        candidateRevision:
          type: integer
          format: int64
          minimum: 0
        original:
          $ref: '#/components/schemas/CandidateBundle'
        current:
          $ref: '#/components/schemas/CandidateBundle'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/CandidateProblem'
        finalCandidate:
          anyOf:
            - $ref: '#/components/schemas/CandidateBundle'
            - type: 'null'
        appliedAt:
          type: [string, 'null']
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/InferenceImage'
        jsonSampleCount:
          type: integer
          minimum: 0
          maximum: 20
    InferenceEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, state, stage, data, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
        state:
          $ref: '#/components/schemas/InferenceRunState'
        stage:
          $ref: '#/components/schemas/InferenceStage'
        data:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    CandidateBundle:
      type: object
      additionalProperties: false
      required: [contractVersion, rootCandidateSchemaId, schemas]
      properties:
        contractVersion:
          type: string
          const: renderweave-candidate/1.0
        rootCandidateSchemaId:
          type: string
          format: uuid
        schemas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CandidateSchema'
    CandidateSchema:
      type: object
      additionalProperties: false
      required: [candidateSchemaId, proposedSchemaKey, displayName, source, assessment, fields]
      properties:
        candidateSchemaId:
          type: string
          format: uuid
        proposedSchemaKey:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        source:
          $ref: '#/components/schemas/CandidateSource'
        assessment:
          $ref: '#/components/schemas/CandidateAssessment'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CandidateField'
    CandidateField:
      type: object
      additionalProperties: false
      required: [candidateFieldId, proposedFieldKey, displayName, required, value, source, assessment]
      properties:
        candidateFieldId:
          type: string
          format: uuid
        proposedFieldKey:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        required:
          type: boolean
        value:
          $ref: '#/components/schemas/CandidateValue'
        source:
          $ref: '#/components/schemas/CandidateSource'
        assessment:
          $ref: '#/components/schemas/CandidateAssessment'
    CandidateValue:
      type: object
      additionalProperties: false
      required: [kind, items, reference, observedKinds, constraints]
      properties:
        kind:
          type: string
          enum: [TEXT, DECIMAL, DATE, TIME, BOOLEAN, REFERENCE, ARRAY, UNRESOLVED, CONFLICT]
        items:
          anyOf:
            - $ref: '#/components/schemas/CandidateValue'
            - type: 'null'
        reference:
          anyOf:
            - $ref: '#/components/schemas/CandidateReference'
            - type: 'null'
        observedKinds:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties:
            type: string
    CandidateReference:
      type: object
      additionalProperties: false
      required: [kind, candidateSchemaId, schemaKey, versionTag]
      properties:
        kind:
          type: [string, 'null']
          enum: [CANDIDATE_SCHEMA, DRAFT, STATIC, null]
        candidateSchemaId:
          type: [string, 'null']
          format: uuid
        schemaKey:
          type: [string, 'null']
        versionTag:
          type: [string, 'null']
    CandidateSource:
      type: string
      enum: [AI, USER]
    CandidateResolution:
      type: string
      enum: [NOT_REQUIRED, UNRESOLVED, CONFIRMED, RESOLVED_BY_EDIT, REMOVED]
    CandidateAssessment:
      type: object
      additionalProperties: false
      required: [confidenceBps, inferred, resolution, evidence]
      properties:
        confidenceBps:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        inferred:
          type: boolean
        resolution:
          $ref: '#/components/schemas/CandidateResolution'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/CandidateEvidence'
    CandidateEvidence:
      type: object
      additionalProperties: false
      required: [kind, artifactId, boundingBox, sampleIndex, jsonPointer]
      properties:
        kind:
          type: string
          enum: [IMAGE, JSON]
        artifactId:
          type: [string, 'null']
        boundingBox:
          anyOf:
            - $ref: '#/components/schemas/CandidateBoundingBox'
            - type: 'null'
        sampleIndex:
          type: [integer, 'null']
          minimum: 0
          maximum: 19
        jsonPointer:
          type: [string, 'null']
    CandidateBoundingBox:
      type: object
      additionalProperties: false
      required: [left, top, right, bottom]
      properties:
        left:
          type: integer
          minimum: 0
          maximum: 10000
        top:
          type: integer
          minimum: 0
          maximum: 10000
        right:
          type: integer
          minimum: 0
          maximum: 10000
        bottom:
          type: integer
          minimum: 0
          maximum: 10000
    CandidateProblem:
      type: object
      additionalProperties: false
      required: [code, severity, itemId, pointer, args]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [BLOCKER, WARNING]
        itemId:
          type: [string, 'null']
          format: uuid
        pointer:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
    InferenceImage:
      type: object
      additionalProperties: false
      required: [artifactId, ordinal, width, height, contentUrl]
      properties:
        artifactId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ordinal:
          type: integer
          minimum: 0
          maximum: 9
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        contentUrl:
          type: string
          format: uri-reference
    Violation:
      type: object
      additionalProperties: false
      required: [code, pointer, args]
      properties:
        code:
          type: string
        pointer:
          type: string
          description: RFC 6901 JSON Pointer relative to the invalid request object.
        args:
          type: object
          additionalProperties: true
        message:
          type: string
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        revision:
          type: integer
          format: int64
          minimum: 0
  responses:
    BadRequestProblem:
      description: Request JSON, key syntax or envelope is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: The requested Draft does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: Natural identity or expected revision conflicts with current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: The complete RenderWeave definition is not valid and nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLargeProblem:
      description: A RootDocument batch or inference multipart body exceeds its transport byte budget.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: The deployment policy has not authorized this external-data operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailableProblem:
      description: Live inference is disabled or its provider credential is not configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalProblem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
