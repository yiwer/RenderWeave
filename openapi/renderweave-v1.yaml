          format: int64
          const: 0
        href:
          type: string
          format: uri-reference
    CandidateReviewResponse:
      type: object
      additionalProperties: false
      required: [run, candidateRevision, original, current, problems, finalCandidate, appliedAt, images, jsonSampleCount]
      properties:
        run:
          $ref: '#/components/schemas/InferenceRunResponse'
        candidateRevision:
          type: integer
          format: int64
          minimum: 0
        original:
          $ref: '#/components/schemas/CandidateBundle'
        current:
          $ref: '#/components/schemas/CandidateBundle'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/CandidateProblem'
        finalCandidate:
          anyOf:
            - $ref: '#/components/schemas/CandidateBundle'
            - type: 'null'
        appliedAt:
          type: [string, 'null']
          format: date-time
        images:
          type: array
          items:
            $ref: '#/components/schemas/InferenceImage'
        jsonSampleCount:
          type: integer
          minimum: 0
          maximum: 20
    InferenceEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, state, stage, data, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
        state:
          $ref: '#/components/schemas/InferenceRunState'
        stage:
          $ref: '#/components/schemas/InferenceStage'
        data:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    CandidateBundle:
      type: object
      additionalProperties: false
      required: [contractVersion, rootCandidateSchemaId, schemas]
      properties:
        contractVersion:
          type: string
          const: renderweave-candidate/1.0
        rootCandidateSchemaId:
          type: string
          format: uuid
        schemas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CandidateSchema'
    CandidateSchema:
      type: object
      additionalProperties: false
      required: [candidateSchemaId, proposedSchemaKey, displayName, source, assessment, fields]
      properties:
        candidateSchemaId:
          type: string
          format: uuid
        proposedSchemaKey:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        source:
          $ref: '#/components/schemas/CandidateSource'
        assessment:
          $ref: '#/components/schemas/CandidateAssessment'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CandidateField'
    CandidateField:
      type: object
      additionalProperties: false
      required: [candidateFieldId, proposedFieldKey, displayName, required, value, source, assessment]
      properties:
        candidateFieldId:
          type: string
          format: uuid
        proposedFieldKey:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        required:
          type: boolean
        value:
          $ref: '#/components/schemas/CandidateValue'
        source:
          $ref: '#/components/schemas/CandidateSource'
        assessment:
          $ref: '#/components/schemas/CandidateAssessment'
    CandidateValue:
      type: object
      additionalProperties: false
      required: [kind, items, reference, observedKinds, constraints]
      properties:
        kind:
          type: string
          enum: [TEXT, DECIMAL, DATE, TIME, BOOLEAN, REFERENCE, ARRAY, UNRESOLVED, CONFLICT]
        items:
          anyOf:
            - $ref: '#/components/schemas/CandidateValue'
            - type: 'null'
        reference:
          anyOf:
            - $ref: '#/components/schemas/CandidateReference'
            - type: 'null'
        observedKinds:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties:
            type: string
    CandidateReference:
      type: object
      additionalProperties: false
      required: [kind, candidateSchemaId, schemaKey, versionTag]
      properties:
        kind:
          type: [string, 'null']
          enum: [CANDIDATE_SCHEMA, DRAFT, STATIC, null]
        candidateSchemaId:
          type: [string, 'null']
          format: uuid
        schemaKey:
          type: [string, 'null']
        versionTag:
          type: [string, 'null']
    CandidateSource:
      type: string
      enum: [AI, USER]
    CandidateResolution:
      type: string
      enum: [NOT_REQUIRED, UNRESOLVED, CONFIRMED, RESOLVED_BY_EDIT, REMOVED]
    CandidateAssessment:
      type: object
      additionalProperties: false
      required: [confidenceBps, inferred, resolution, evidence]
      properties:
        confidenceBps:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        inferred:
          type: boolean
        resolution:
          $ref: '#/components/schemas/CandidateResolution'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/CandidateEvidence'
    CandidateEvidence:
      type: object
      additionalProperties: false
      required: [kind, artifactId, boundingBox, sampleIndex, jsonPointer]
      properties:
        kind:
          type: string
          enum: [IMAGE, JSON]
        artifactId:
          type: [string, 'null']
        boundingBox:
          anyOf:
            - $ref: '#/components/schemas/CandidateBoundingBox'
            - type: 'null'
        sampleIndex:
          type: [integer, 'null']
          minimum: 0
          maximum: 19
        jsonPointer:
          type: [string, 'null']
    CandidateBoundingBox:
      type: object
      additionalProperties: false
      required: [left, top, right, bottom]
      properties:
        left:
          type: integer
          minimum: 0
          maximum: 10000
        top:
          type: integer
          minimum: 0
          maximum: 10000
        right:
          type: integer
          minimum: 0
          maximum: 10000
        bottom:
          type: integer
          minimum: 0
          maximum: 10000
    CandidateProblem:
      type: object
      additionalProperties: false
      required: [code, severity, itemId, pointer, args]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [BLOCKER, WARNING]
        itemId:
          type: [string, 'null']
          format: uuid
        pointer:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
    InferenceImage:
      type: object
      additionalProperties: false
      required: [artifactId, ordinal, width, height, contentUrl]
      properties:
        artifactId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ordinal:
          type: integer
          minimum: 0
          maximum: 9
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        contentUrl:
          type: string
          format: uri-reference
    Violation:
      type: object
      additionalProperties: false
      required: [code, pointer, args]
      properties:
        code:
          type: string
        pointer:
          type: string
          description: RFC 6901 JSON Pointer relative to the invalid request object.
        args:
          type: object
          additionalProperties: true
        message:
          type: string
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        revision:
          type: integer
          format: int64
          minimum: 0
        stage:
          type: string
        pointer:
          type: string
          description: RFC 6901 pointer into the rejected DesignDSL when applicable.
        limit:
          type: string
        currentRevision:
          type: integer
          format: int64
          minimum: 0
    RenderInput:
      type: object
      additionalProperties: false
      required: [rootDocument]
      description: >-
        Strict UTF-8 JSON input for one Evaluation. Duplicate members, trailing content and values
        beyond the authoritative RenderInput budgets are rejected even when not expressible here.
        The complete entity is limited to 8 MiB.
      properties:
        rootDocument:
          type: object
          description: RootDocument validated against the saved Template current's StaticSchema.
        customValues:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [definitionId, value]
            properties:
              definitionId:
                type: string
                format: uuid
              value: {}
    RenderProblemParameters:
      type: object
      additionalProperties: false
      properties:
        limitId:
          type: string
          minLength: 1
          maxLength: 256
    RenderProblem:
      type: object
      additionalProperties: false
      required: [contractVersion, code, stage, parameters]
      properties:
        contractVersion:
          type: string
          const: renderweave-render-problem/1.0
        renderOperationId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Public operation identity; absent only when HTTP admission fails before application invocation.
        code:
          type: string
          minLength: 1
          maxLength: 128
        stage:
          type: string
          enum:
            - REQUEST_ADMISSION
            - TEMPLATE_CLOSURE
            - INPUT_ADMISSION
            - ASSET_ADMISSION
            - CAPABILITY_STATE
            - MATERIALIZATION
            - ASSET_RESOLUTION
            - DOCUMENT_SEAL
            - ENGINE
        safeLocation:
          type: string
          minLength: 1
          maxLength: 1024
        parameters:
          $ref: '#/components/schemas/RenderProblemParameters'
  responses:
    RenderedImage:
      description: One complete, digest-verified PNG or JPEG; no partial bytes or stale fallback.
      headers:
        Content-Length:
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        Content-Digest:
          required: true
          schema:
            type: string
            pattern: '^sha-256=:[A-Za-z0-9+/]+={0,2}:$'
        RenderWeave-Result-Version:
          required: true
          schema:
            type: string
            const: renderweave-render-result/1.0
        RenderWeave-Request-Id:
          required: true
          description: Public renderOperationId; never the Engine requestId.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        RenderWeave-Renderer-Profile:
          required: true
          schema:
            type: string
        RenderWeave-DSL-Version:
          required: true
          schema:
            type: string
            const: renderweave-render/1.0
        RenderWeave-Layout-Profile:
          required: true
          schema:
            type: string
        RenderWeave-Output-Profile:
          required: true
          schema:
            type: string
        RenderWeave-Format:
          required: true
          schema:
            type: string
            enum: [PNG, JPEG]
        RenderWeave-Width-Px:
          required: true
          schema:
            type: integer
            minimum: 1
        RenderWeave-Height-Px:
          required: true
          schema:
            type: integer
            minimum: 1
        RenderWeave-DPI:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 600
        RenderWeave-Quality:
          required: false
          description: Present only for JPEG.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
    RenderProblem:
      description: Closed Rendering failure with zero image bytes and no success metadata.
      content:
        'application/vnd.renderweave.render-problem+json;version=1.0':
          schema:
            $ref: '#/components/schemas/RenderProblem'
    BadRequestProblem:
      description: Request JSON, key syntax or envelope is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: The requested Draft does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: Natural identity or expected revision conflicts with current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: The complete RenderWeave definition is not valid and nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLargeProblem:
      description: A RootDocument batch or inference multipart body exceeds its transport byte budget.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: The deployment policy has not authorized this external-data operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailableProblem:
      description: Live inference is disabled or its provider credential is not configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalProblem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TemplateForbiddenProblem:
      description: The caller lacks the required Template operation capability.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TemplateNotFoundProblem:
      description: The exact StaticSchema or visible Template required by this operation does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TemplatePayloadTooLargeProblem:
      description: The complete DesignDSL exceeds an authoritative byte or canonical-count limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TemplateAuthoringValidationProblem:
      description: >-
        Design admission or dependency validation rejected the request. A confirmable save carries
        the exact bounded problem set, proposed content hash, expiry and opaque confirmation token;
        hard or truncated sets never carry a usable token. No write occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TemplateAuthoringProblem'
    TemplateServiceUnavailableProblem:
      description: Template authorization, dependency checking, confirmation or persistence is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetForbiddenProblem:
      description: The caller lacks the required Asset operation capability.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetNotFoundProblem:
      description: The visible Asset required by this operation does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetPayloadTooLargeProblem:
      description: The complete Asset multipart body or admitted content exceeds an authoritative limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetCapacityExceededProblem:
      description: The deployment-level Asset capacity watermark would be exceeded by a new blob.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetServiceUnavailableProblem:
      description: Asset authorization or persistence is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
