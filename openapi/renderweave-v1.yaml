          format: int64
          minimum: 0
    get:
      operationId: streamInferenceRunEvents
      tags: [Inference Runs]
      summary: Stream at-least-once run notifications after a monotonic sequence
      description: Clients deduplicate by SSE id and then GET the authoritative run or Candidate snapshot.
      responses:
        '200':
          description: SSE notifications; each data payload conforms to InferenceEvent.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/inference-runs/{runId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/InferenceRunId'
      - $ref: '#/components/parameters/InferenceArtifactId'
    get:
      operationId: getInferenceImageArtifact
      tags: [Inference Runs]
      summary: Read a normalized image that belongs to this run for evidence review
      responses:
        '200':
          description: Metadata-free normalized PNG.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    InferenceRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InferenceArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    SchemaKey:
      name: schemaKey
      in: path
      required: true
      description: Stable Draft identity. The reserved system- prefix is not valid for user Drafts.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    ExpectedRevision:
      name: expectedRevision
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775806
    TemplateId:
      name: templateId
      in: path
      required: true
      description: Server-generated opaque Template identity; clients must not parse its encoding.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TemplateSearch:
      name: search
      in: query
      required: false
      description: Literal case-insensitive contains match against the current display name or Template identity.
      schema:
        type: string
        maxLength: 200
    TemplateCursor:
      name: cursor
      in: query
      required: false
      description: Opaque stable cursor returned by the preceding Template catalog page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TemplateLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    TemplateSchemaKey:
      name: schemaKey
      in: query
      required: true
      description: Exact permanent StaticSchema key selected during Template creation.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    TemplateVersionTag:
      name: versionTag
      in: query
      required: true
      description: Exact permanent StaticSchema version selected during Template creation.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    TemplateInvalidSaveConfirmationToken:
      name: X-Confirmation-Token
      in: header
      required: false
      description: >-
        Five-minute opaque token from TEMPLATE_DEPENDENCY_CONFIRMATION_REQUIRED. It authorizes only
        an exact invalid Template save bound to actor, owner, Template, StaticSchema,
        expectedRevision, proposed content, complete problem set and dependency snapshot.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    RenderFormat:
      name: format
      in: query
      required: true
      description: Bounded public output format; callers cannot select an exact Output Profile.
      schema:
        type: string
        enum: [PNG, JPEG]
    RenderDpi:
      name: dpi
      in: query
      required: false
      description: Positive effective output DPI; omission expands to 96 before Evaluation.
      schema:
        type: integer
        minimum: 1
        maximum: 600
        default: 96
    RenderJpegQuality:
      name: quality
      in: query
      required: false
      description: JPEG-only quality; omission for JPEG expands to 90 and presence for PNG is rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 90
    RenderContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: The only accepted content coding is identity; compressed RenderInput is rejected.
      schema:
        type: string
        enum: [identity]
    AssetId:
      name: assetId
      in: path
      required: true
      description: Server-generated canonical UUID v4 Asset identity; clients must not parse its encoding.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    AssetKind:
      name: kind
      in: query
      required: false
      description: Exact Asset kind filter; absent means all kinds.
      schema:
        type: string
        enum: [IMAGE, FONT]
    AssetTagsAll:
      name: tagsAll
      in: query
      required: false
      description: Repeated filter; an entry must carry every tag (case-folded).
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
    AssetTagsAny:
      name: tagsAny
      in: query
      required: false
      description: Repeated filter; an entry must carry at least one tag (case-folded).
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
    AssetDisplayNameContains:
      name: displayName
      in: query
      required: false
      description: Case-insensitive substring matched against the display name.
      schema:
        type: string
        maxLength: 200
    AssetSourceFileNameContains:
      name: sourceFileName
      in: query
      required: false
      description: Case-insensitive substring matched against the current source file name.
      schema:
        type: string
        maxLength: 255
    AssetIncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: Explicitly include DELETED Assets alongside ACTIVE ones. Defaults to ACTIVE only.
      schema:
        type: boolean
        default: false
    AssetCursor:
      name: cursor
      in: query
      required: false
      description: Opaque stable-cursor token returned by the previous page.
      schema:
        type: string
        maxLength: 512
    AssetLimit:
      name: limit
      in: query
      required: false
      description: Maximum entries on this page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AssetExpectedAssetRevision:
      name: expectedAssetRevision
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775806
    AssetContentVersion:
      name: contentVersion
      in: query
      required: true
      description: Exact immutable content version to download.
      schema:
        type: integer
        format: int64
        minimum: 0
    AssetSourceContentVersion:
      name: sourceContentVersion
      in: query
      required: true
      description: Exact immutable historical content version whose bytes are restored as a new current.
      schema:
        type: integer
        format: int64
        minimum: 0
    AssetConfirmationToken:
      name: X-Confirmation-Token
      in: header
      required: true
      description: Single-use confirmation token issued by the delete precheck.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive substring matched against the resource identity and display name.
      schema:
        type: string
        maxLength: 128
        default: ''
    DraftListSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [UPDATED_DESC, UPDATED_ASC, NAME_ASC, NAME_DESC]
        default: UPDATED_DESC
    StaticSchemaListSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [PUBLISHED_DESC, PUBLISHED_ASC, NAME_ASC, NAME_DESC]
        default: PUBLISHED_DESC
    StaticSchemaOriginFilter:
      name: origin
      in: query
      required: false
      schema:
        type: string
        enum: [ALL, DRAFT, SYSTEM]
        default: ALL
    StaticSchemaKey:
      name: schemaKey
      in: path
      required: true
      description: User or reserved system StaticSchema key.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    VersionTag:
      name: versionTag
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  schemas:
    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, status, database, contractVersion]
      properties:
        service:
          type: string
          const: renderweave-api
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [ready]
        contractVersion:
          type: string
          const: 0.16.0
    AssetDeletePrecheckResponse:
      type: object
      additionalProperties: false
      required: [totalCount, readableTemplates, redactedCount, confirmationToken, expiresAt]
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Complete current-only count of ACTIVE Templates referencing the Asset.
        readableTemplates:
          type: array
          items:
            type: string
            description: Template id the caller may read.
        redactedCount:
          type: integer
          minimum: 0
          description: Referencing Templates the caller may not read.
        confirmationToken:
          type: string
          minLength: 64
          maxLength: 64
          description: Single-use delete confirmation token valid for 5 minutes.
        expiresAt:
          type: string
          format: date-time
          description: Instant the confirmation token expires.
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, definition]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, definition]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
    RestoreDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, sourceRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        sourceRevision:
          type: integer
          format: int64
          minimum: 0
    CopyDraftRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, displayName]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    PublishStaticSchemaRequest:
      type: object
      additionalProperties: false
      required: [schemaKey, expectedRevision, versionTag]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        versionTag:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        releaseNote:
          type: string
    DraftResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - revision
        - definition
        - creationSource
        - createdAt
        - updatedAt
        - savedAt
        - resolvedRevisions
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        creationSource:
          type: string
          enum: [USER, AI]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
        resolvedRevisions:
          type: object
          description: Root-inclusive request snapshot of live Draft revisions.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    DraftListResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    DraftSummary:
      type: object
      additionalProperties: false
      required: [schemaKey, revision, creationSource, displayName, fieldCount, createdAt, updatedAt, savedAt]
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        creationSource:
          type: string
          enum: [USER, AI]
        displayName:
          type: string
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
    DraftHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftRevisionSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    DraftRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, displayName, fieldCount, savedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        displayName:
          type: string
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        savedAt:
          type: string
          format: date-time
    DraftRevisionResponse:
      type: object
      additionalProperties: false
      required: [schemaKey, revision, definition, savedAt]
      properties:
        schemaKey:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        savedAt:
          type: string
          format: date-time
    StaticSchemaResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - versionTag
        - origin
        - sourceDraftRevision
        - definition
        - compilerVersion
        - releaseNote
        - referenceDepth
        - publishedAt
      properties:
        schemaKey:
          type: string
        versionTag:
          type: string
        origin:
          type: string
          enum: [DRAFT, SYSTEM]
        sourceDraftRevision:
          type: [integer, 'null']
          format: int64
          minimum: 0
        definition:
          $ref: '#/components/schemas/SchemaDefinition'
        compilerVersion:
          type: string
        releaseNote:
          type: [string, 'null']
        referenceDepth:
          type: integer
          minimum: 1
          maximum: 16
        publishedAt:
          type: string
          format: date-time
    StaticSchemaListResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaticSchemaSummaryResponse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    StaticSchemaSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - schemaKey
        - versionTag
        - origin
        - displayName
        - fieldCount
        - referenceDepth
        - publishedAt
      properties:
        schemaKey: { type: string }
        versionTag: { type: string }
        origin:
          type: string
          enum: [DRAFT, SYSTEM]
        displayName: { type: string }
        fieldCount:
          type: integer
          minimum: 0
          maximum: 256
        referenceDepth:
          type: integer
          minimum: 1
          maximum: 16
        publishedAt:
          type: string
          format: date-time
    SchemaDefinition:
      type: object
      additionalProperties: false
      required: [dslVersion, displayName, fields]
      properties:
        dslVersion:
          type: string
          const: renderweave-schema/1.0
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        fields:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/SchemaField'
    SchemaField:
      type: object
      additionalProperties: false
      required: [fieldKey, required, value]
      properties:
        fieldKey:
          type: string
          minLength: 1
          x-renderweave-max-utf8-bytes: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        required:
          type: boolean
        value:
          $ref: '#/components/schemas/ValueDescriptor'
    ValueDescriptor:
      oneOf:
        - $ref: '#/components/schemas/TextValue'
        - $ref: '#/components/schemas/DecimalValue'
        - $ref: '#/components/schemas/DateValue'
        - $ref: '#/components/schemas/TimeValue'
        - $ref: '#/components/schemas/BooleanValue'
        - $ref: '#/components/schemas/ReferenceValue'
        - $ref: '#/components/schemas/ArrayValue'
    TextValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: text
        constraints:
          $ref: '#/components/schemas/TextConstraints'
    TextConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minLength:
          type: integer
          minimum: 0
          maximum: 65536
        maxLength:
          type: integer
          minimum: 0
          maximum: 65536
        pattern:
          type: string
          maxLength: 1024
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
        const:
          type: string
    DecimalValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: decimal
        constraints:
          $ref: '#/components/schemas/DecimalConstraints'
    DecimalConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { type: number }
        exclusiveMin: { type: number }
        max: { type: number }
        exclusiveMax: { type: number }
        multipleOf: { type: number, exclusiveMinimum: 0 }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: number }
        const: { type: number }
    DateValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: date }
        constraints:
          $ref: '#/components/schemas/DateConstraints'
    DateConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { $ref: '#/components/schemas/DateLiteral' }
        exclusiveMin: { $ref: '#/components/schemas/DateLiteral' }
        max: { $ref: '#/components/schemas/DateLiteral' }
        exclusiveMax: { $ref: '#/components/schemas/DateLiteral' }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/DateLiteral' }
        const: { $ref: '#/components/schemas/DateLiteral' }
    DateLiteral:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    TimeValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: time }
        constraints:
          $ref: '#/components/schemas/TimeConstraints'
    TimeConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min: { $ref: '#/components/schemas/TimeLiteral' }
        exclusiveMin: { $ref: '#/components/schemas/TimeLiteral' }
        max: { $ref: '#/components/schemas/TimeLiteral' }
        exclusiveMax: { $ref: '#/components/schemas/TimeLiteral' }
        enum:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: '#/components/schemas/TimeLiteral' }
        const: { $ref: '#/components/schemas/TimeLiteral' }
    TimeLiteral:
      type: string
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
    BooleanValue:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: boolean }
        constraints:
          $ref: '#/components/schemas/BooleanConstraints'
    BooleanConstraints:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        const: { type: boolean }
    ReferenceValue:
      type: object
      additionalProperties: false
      required: [type, ref]
      properties:
        type: { type: string, const: reference }
        ref:
          $ref: '#/components/schemas/SchemaReference'
    SchemaReference:
      oneOf:
        - $ref: '#/components/schemas/SchemaRef'
        - $ref: '#/components/schemas/StaticSchemaRef'
    SchemaRef:
      type: object
      additionalProperties: false
      required: [schemaKey]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    StaticSchemaRef:
      type: object
      additionalProperties: false
      required: [schemaKey, versionTag]
      properties:
        schemaKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        versionTag:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    DesignDslKernel:
      type: object
      additionalProperties: false
      description: >-
        Complete closed HTTP projection of the admitted renderweave-design/1.0 authoring wire.
        Cross-field, lexical-scope, dependency and capacity semantics remain enforced by the
        Template-owned DesignDslAuthority.
      required: [dslVersion, expressionProfile, displayName, definitions, designRoot]
      properties:
        dslVersion:
          type: string
          const: renderweave-design/1.0
        expressionProfile:
          type: string
          const: renderweave-expression/1.0
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/DesignDefinition'
        designRoot:
          $ref: '#/components/schemas/DesignCanvasNode'
    DesignDefinition:
      oneOf:
        - $ref: '#/components/schemas/DesignCustomDefinition'
        - $ref: '#/components/schemas/DesignMappingDefinition'
        - $ref: '#/components/schemas/DesignExpressionDefinition'
      discriminator:
        propertyName: kind
        mapping:
          custom: '#/components/schemas/DesignCustomDefinition'
          mapping: '#/components/schemas/DesignMappingDefinition'
          expression: '#/components/schemas/DesignExpressionDefinition'
    DesignCustomDefinition:
      type: object
      additionalProperties: false
      required: [definitionId, kind, displayName, exposure, valueType, defaultValue]
      properties:
        definitionId:
          $ref: '#/components/schemas/DesignUuidV4'
        kind:
          type: string
          const: custom
        displayName:
          $ref: '#/components/schemas/DesignDisplayName'
        exposure:
          type: string
          enum: [PUBLIC, PRIVATE]
        valueType:
          $ref: '#/components/schemas/DesignValueType'
        defaultValue:
          $ref: '#/components/schemas/DesignLiteralValue'
    DesignMappingDefinition:
      type: object
      additionalProperties: false
      required: [definitionId, kind, displayName, domain, output, input, cases, otherwise]
      properties:
        definitionId:
          $ref: '#/components/schemas/DesignUuidV4'
        kind:
          type: string
          const: mapping
        displayName:
          $ref: '#/components/schemas/DesignDisplayName'
        domain:
          $ref: '#/components/schemas/DesignDefinitionDomain'
        output:
          $ref: '#/components/schemas/DesignValueType'
        input:
          $ref: '#/components/schemas/DesignNonCapabilityValueSource'
        cases:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DesignMappingCase'
        otherwise:
          $ref: '#/components/schemas/DesignNonCapabilityValueSource'
    DesignExpressionDefinition:
      type: object
      additionalProperties: false
      required: [definitionId, kind, displayName, domain, output, inputs, source]
      properties:
        definitionId:
          $ref: '#/components/schemas/DesignUuidV4'
        kind:
          type: string
          const: expression
        displayName:
          $ref: '#/components/schemas/DesignDisplayName'
        domain:
          $ref: '#/components/schemas/DesignDefinitionDomain'
        output:
          $ref: '#/components/schemas/DesignValueType'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/DesignExpressionInput'
        source:
          type: string
    DesignDefinitionDomain:
      oneOf:
        - type: string
          const: invocation
        - $ref: '#/components/schemas/DesignLoopDomain'
    DesignLoopDomain:
      type: object
      additionalProperties: false
      required: [kind, loopId]
      properties:
        kind:
          type: string
          const: loop
        loopId:
          $ref: '#/components/schemas/DesignUuidV4'
    DesignValueType:
      oneOf:
        - $ref: '#/components/schemas/DesignBaseValueType'
        - $ref: '#/components/schemas/DesignListValueType'
        - $ref: '#/components/schemas/DesignEnumValueType'
    DesignBaseValueType:
      type: string
      enum: [text, decimal, boolean, date, time, color, imageRef, fontRef]
    DesignListValueType:
      type: object
      additionalProperties: false
      required: [type, items]
      properties:
        type:
          type: string
          const: list
        items:
          type: string
          enum: [text, decimal, boolean, date, time, imageRef, fontRef]
    DesignEnumValueType:
      type: object
      additionalProperties: false
      required: [type, catalogId]
      properties:
        type:
          type: string
          const: enum
        catalogId:
          type: string
          minLength: 1
    DesignLiteralValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - $ref: '#/components/schemas/DesignAssetRef'
        - type: array
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - $ref: '#/components/schemas/DesignAssetRef'
    DesignValueSource:
      oneOf:
        - $ref: '#/components/schemas/DesignLiteralSource'
        - $ref: '#/components/schemas/DesignContextSource'
        - $ref: '#/components/schemas/DesignLoopIndexSource'
        - $ref: '#/components/schemas/DesignDefinitionSource'
        - $ref: '#/components/schemas/DesignCapabilitySource'
      discriminator:
        propertyName: kind
        mapping:
          literal: '#/components/schemas/DesignLiteralSource'
          context: '#/components/schemas/DesignContextSource'
          loopIndex: '#/components/schemas/DesignLoopIndexSource'
          definition: '#/components/schemas/DesignDefinitionSource'
          capability: '#/components/schemas/DesignCapabilitySource'
    DesignNonCapabilityValueSource:
      oneOf:
        - $ref: '#/components/schemas/DesignLiteralSource'
        - $ref: '#/components/schemas/DesignContextSource'
        - $ref: '#/components/schemas/DesignLoopIndexSource'
        - $ref: '#/components/schemas/DesignDefinitionSource'
      discriminator:
        propertyName: kind
        mapping:
          literal: '#/components/schemas/DesignLiteralSource'
          context: '#/components/schemas/DesignContextSource'
          loopIndex: '#/components/schemas/DesignLoopIndexSource'
          definition: '#/components/schemas/DesignDefinitionSource'
    DesignBindingSource:
      oneOf:
        - $ref: '#/components/schemas/DesignContextSource'
        - $ref: '#/components/schemas/DesignLoopIndexSource'
        - $ref: '#/components/schemas/DesignDefinitionSource'
      discriminator:
        propertyName: kind
        mapping:
          context: '#/components/schemas/DesignContextSource'
          loopIndex: '#/components/schemas/DesignLoopIndexSource'
          definition: '#/components/schemas/DesignDefinitionSource'
    DesignStructuralValueSource:
      oneOf:
        - $ref: '#/components/schemas/DesignLiteralSource'
        - $ref: '#/components/schemas/DesignContextSource'
        - $ref: '#/components/schemas/DesignDefinitionSource'
      discriminator:
        propertyName: kind
        mapping:
          literal: '#/components/schemas/DesignLiteralSource'
          context: '#/components/schemas/DesignContextSource'
          definition: '#/components/schemas/DesignDefinitionSource'
    DesignLiteralSource:
      type: object
      additionalProperties: false
      required: [kind, valueType, value]
      properties:
        kind:
          type: string
          const: literal
        valueType:
          $ref: '#/components/schemas/DesignValueType'
        value:
          $ref: '#/components/schemas/DesignLiteralValue'
    DesignContextSource:
      type: object
      additionalProperties: false
      required: [kind, domain, pointer]
      properties:
        kind:
          type: string
          const: context
        domain:
          $ref: '#/components/schemas/DesignDefinitionDomain'
        pointer:
          type: string
          pattern: '^/(?:[^~/]|~[01])+(?:/(?:[^~/]|~[01])*)*$'
          maxLength: 1024
    DesignLoopIndexSource:
      type: object
      additionalProperties: false
      required: [kind, loopId]
      properties:
        kind:
          type: string
          const: loopIndex
        loopId:
          $ref: '#/components/schemas/DesignUuidV4'
    DesignDefinitionSource:
      type: object
      additionalProperties: false
      required: [kind, definitionId]
      properties:
        kind:
          type: string
          const: definition
        definitionId:
          $ref: '#/components/schemas/DesignUuidV4'
    DesignCapabilitySource:
      type: object
      additionalProperties: false
      required: [kind, capability, operation]
      properties:
        kind:
          type: string
          const: capability
        capability:
          type: string
          enum: [CLOCK, RANDOM]
        operation:
          type: string
          enum: [UTC_DATE, UTC_TIME, UNIFORM_DECIMAL_0_1]
    DesignMappingCase:
      type: object
      additionalProperties: false
      required: [operator, then]
      properties:
        operator:
          type: string
          enum:
            - IS_ABSENT
            - IS_PRESENT
            - EQ
            - NOT_EQ
            - GT
            - GTE
            - LT
            - LTE
            - CONTAINS
            - STARTS_WITH
            - ENDS_WITH
            - PATTERN_MATCH
            - IS_BLANK
            - IS_NOT_BLANK
        operand:
          $ref: '#/components/schemas/DesignMappingOperand'
        then:
          $ref: '#/components/schemas/DesignNonCapabilityValueSource'
    DesignMappingOperand:
      type: object
      additionalProperties: false
      required: [valueType, value]
      properties:
        valueType:
          $ref: '#/components/schemas/DesignValueType'
        value:
          $ref: '#/components/schemas/DesignLiteralValue'
    DesignExpressionInput:
      type: object
      additionalProperties: false
      required: [alias, source]
      properties:
        alias:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
        source:
          $ref: '#/components/schemas/DesignValueSource'
    DesignBinding:
      type: object
      additionalProperties: false
      required: [bindingId, targetPropertyRef, source]
      properties:
        bindingId:
          $ref: '#/components/schemas/DesignUuidV4'
        targetPropertyRef:
          $ref: '#/components/schemas/DesignTargetPropertyRef'
        source:
          $ref: '#/components/schemas/DesignBindingSource'
    DesignTargetPropertyRef:
      type: object
      additionalProperties: false
      required: [rootPropertyId, selectors]
      properties:
        rootPropertyId:
          type: string
          minLength: 1
        selectors:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/DesignPropertySelector'
    DesignPropertySelector:
      oneOf:
        - $ref: '#/components/schemas/DesignMemberSelector'
        - $ref: '#/components/schemas/DesignIndexSelector'
      discriminator:
        propertyName: kind
        mapping:
          member: '#/components/schemas/DesignMemberSelector'
          index: '#/components/schemas/DesignIndexSelector'
    DesignMemberSelector:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          const: member
        name:
          type: string
          minLength: 1
    DesignIndexSelector:
      type: object
      additionalProperties: false
      required: [kind, index]
      properties:
        kind:
          type: string
          const: index
        index:
          type: integer
          minimum: 0
    DesignUuidV4:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    DesignDisplayName:
      type: string
      minLength: 1
      maxLength: 128
    DesignAssetRef:
      type: object
      additionalProperties: false
      required: [assetId]
      properties:
        assetId:
          $ref: '#/components/schemas/DesignUuidV4'
    DesignCanvasNode:
      type: object
      additionalProperties: false
      required: [nodeId, kind, widthMm, heightMm, bindings, children]
      properties:
        nodeId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        kind:
          type: string
          const: canvas
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        widthMm:
          type: number
          exclusiveMinimum: 0
        heightMm:
          type: number
          exclusiveMinimum: 0
        backgroundColor:
          type: string
          pattern: '^#[0-9A-F]{8}$'
        bleed:
          $ref: '#/components/schemas/DesignBleed'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/DesignBinding'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DesignNode'
    DesignBleed:
      type: object
      additionalProperties: false
      required: [topMm, rightMm, bottomMm, leftMm]
      properties:
        topMm:
          type: number
          minimum: 0
        rightMm:
          type: number
          minimum: 0
        bottomMm:
          type: number
          minimum: 0
        leftMm:
          type: number
          minimum: 0
    DesignTransform:
      type: object
      additionalProperties: false
      required: [rotationDeg, scaleX, scaleY, originX, originY]
      properties:
        rotationDeg: { type: number }
        scaleX: { type: number }
        scaleY: { type: number }
        originX: { type: number, minimum: 0, maximum: 1 }
        originY: { type: number, minimum: 0, maximum: 1 }
    DesignFill:
      type: object
      additionalProperties: false
      required: [color]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-F]{8}$'
    DesignStrokeMm:
      type: object
      additionalProperties: false
      required: [color, widthMm, cap, join]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-F]{8}$'
        widthMm: { type: number, exclusiveMinimum: 0 }
        cap: { type: string, enum: [BUTT, ROUND, SQUARE] }
        join: { type: string, enum: [MITER, ROUND, BEVEL] }
    DesignStrokePt:
      type: object
      additionalProperties: false
      required: [color, widthPt, cap, join]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-F]{8}$'
        widthPt: { type: number, exclusiveMinimum: 0 }
        cap: { type: string, enum: [BUTT, ROUND, SQUARE] }
        join: { type: string, enum: [MITER, ROUND, BEVEL] }
    DesignPadding:
      type: object
      additionalProperties: false
      required: [topMm, rightMm, bottomMm, leftMm]
      properties:
        topMm: { type: number, minimum: 0 }
        rightMm: { type: number, minimum: 0 }
        bottomMm: { type: number, minimum: 0 }
        leftMm: { type: number, minimum: 0 }
    DesignCornerRadii:
      type: object
      additionalProperties: false
      required: [topLeftMm, topRightMm, bottomRightMm, bottomLeftMm]
      properties:
        topLeftMm: { type: number, minimum: 0 }
        topRightMm: { type: number, minimum: 0 }
        bottomRightMm: { type: number, minimum: 0 }
        bottomLeftMm: { type: number, minimum: 0 }
    DesignPointMm:
      type: object
      additionalProperties: false
      required: [xMm, yMm]
      properties:
        xMm: { type: number }
        yMm: { type: number }
    DesignPlacement:
      oneOf:
        - $ref: '#/components/schemas/DesignAbsolutePlacement'
        - $ref: '#/components/schemas/DesignStackPlacement'
        - $ref: '#/components/schemas/DesignGridPlacement'
        - $ref: '#/components/schemas/DesignPackPlacement'
      discriminator:
        propertyName: type
        mapping:
          ABSOLUTE: '#/components/schemas/DesignAbsolutePlacement'
          STACK: '#/components/schemas/DesignStackPlacement'
          GRID: '#/components/schemas/DesignGridPlacement'
          PACK: '#/components/schemas/DesignPackPlacement'
    DesignAbsolutePlacement:
      type: object
      additionalProperties: false
      required: [type, xMm, yMm, widthMode, heightMode]
      properties:
        type: { type: string, const: ABSOLUTE }
        xMm: { type: number }
        yMm: { type: number }
        widthMode: { $ref: '#/components/schemas/DesignSizeMode' }
        heightMode: { $ref: '#/components/schemas/DesignSizeMode' }
        widthMm: { type: number, exclusiveMinimum: 0 }
        heightMm: { type: number, exclusiveMinimum: 0 }
        minWidthMm: { type: number, minimum: 0 }
        minHeightMm: { type: number, minimum: 0 }
        maxWidthMm: { type: number, exclusiveMinimum: 0 }
        maxHeightMm: { type: number, exclusiveMinimum: 0 }
        rightInsetMm: { type: number }
        bottomInsetMm: { type: number }
    DesignStackPlacement:
      type: object
      additionalProperties: false
      required: [type, widthMode, heightMode]
      properties:
        type: { type: string, const: STACK }
        widthMode: { $ref: '#/components/schemas/DesignSizeMode' }
        heightMode: { $ref: '#/components/schemas/DesignSizeMode' }
        widthMm: { type: number, exclusiveMinimum: 0 }
        heightMm: { type: number, exclusiveMinimum: 0 }
        minWidthMm: { type: number, minimum: 0 }
        minHeightMm: { type: number, minimum: 0 }
        maxWidthMm: { type: number, exclusiveMinimum: 0 }
        maxHeightMm: { type: number, exclusiveMinimum: 0 }
        marginTopMm: { type: number }
        marginRightMm: { type: number }
        marginBottomMm: { type: number }
        marginLeftMm: { type: number }
        alignSelf: { type: string, enum: [START, CENTER, END] }
        fillWeight: { type: number, exclusiveMinimum: 0 }
    DesignGridPlacement:
      type: object
      additionalProperties: false
      required: [type, widthMode, heightMode, row, column]
      properties:
        type: { type: string, const: GRID }
        widthMode: { $ref: '#/components/schemas/DesignSizeMode' }
        heightMode: { $ref: '#/components/schemas/DesignSizeMode' }
        widthMm: { type: number, exclusiveMinimum: 0 }
        heightMm: { type: number, exclusiveMinimum: 0 }
        minWidthMm: { type: number, minimum: 0 }
        minHeightMm: { type: number, minimum: 0 }
        maxWidthMm: { type: number, exclusiveMinimum: 0 }
        maxHeightMm: { type: number, exclusiveMinimum: 0 }
        row: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        marginTopMm: { type: number }
        marginRightMm: { type: number }
        marginBottomMm: { type: number }
        marginLeftMm: { type: number }
        horizontalAlignSelf: { type: string, enum: [START, CENTER, END] }
        verticalAlignSelf: { type: string, enum: [START, CENTER, END] }
    DesignPackPlacement:
      type: object
      additionalProperties: false
      required: [type, widthMode, heightMode]
      properties:
        type: { type: string, const: PACK }
        widthMode: { type: string, enum: [FIXED, HUG_CONTENT] }
        heightMode: { type: string, enum: [FIXED, HUG_CONTENT] }
        widthMm: { type: number, exclusiveMinimum: 0 }
        heightMm: { type: number, exclusiveMinimum: 0 }
        minWidthMm: { type: number, minimum: 0 }
        minHeightMm: { type: number, minimum: 0 }
        maxWidthMm: { type: number, exclusiveMinimum: 0 }
        maxHeightMm: { type: number, exclusiveMinimum: 0 }
    DesignSizeMode:
      type: string
      enum: [FIXED, HUG_CONTENT, FILL]
    DesignTrack:
      oneOf:
        - $ref: '#/components/schemas/DesignFixedTrack'
        - $ref: '#/components/schemas/DesignFractionTrack'
        - $ref: '#/components/schemas/DesignAutoTrack'
      discriminator:
        propertyName: type
        mapping:
          FIXED: '#/components/schemas/DesignFixedTrack'
          FRACTION: '#/components/schemas/DesignFractionTrack'
          AUTO: '#/components/schemas/DesignAutoTrack'
    DesignFixedTrack:
      type: object
      additionalProperties: false
      required: [type, valueMm]
      properties:
        type: { type: string, const: FIXED }
        valueMm: { type: number, exclusiveMinimum: 0 }
    DesignFractionTrack:
      type: object
      additionalProperties: false
      required: [type, weight]
      properties:
        type: { type: string, const: FRACTION }
        weight: { type: number, exclusiveMinimum: 0 }
    DesignAutoTrack:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: AUTO }
    DesignRepeatPackingSpec:
      oneOf:
        - $ref: '#/components/schemas/DesignStackPackingSpec'
        - $ref: '#/components/schemas/DesignGridPackingSpec'
      discriminator:
        propertyName: kind
        mapping:
          STACK: '#/components/schemas/DesignStackPackingSpec'
          GRID: '#/components/schemas/DesignGridPackingSpec'
    DesignStackPackingSpec:
      type: object
      additionalProperties: false
      required: [kind, direction]
      properties:
        kind: { type: string, const: STACK }
        direction: { type: string, enum: [ROW, COLUMN] }
        gapMm: { type: number, minimum: 0 }
    DesignGridPackingSpec:
      type: object
      additionalProperties: false
      required: [kind, columns]
      properties:
        kind: { type: string, const: GRID }
        columns: { type: integer, minimum: 1 }
        columnGapMm: { type: number, minimum: 0 }
        rowGapMm: { type: number, minimum: 0 }
    DesignTextRun:
      type: object
      additionalProperties: false
      required: [text, fontRef, fontSizePt, color, decoration]
      properties:
        text: { type: string }
        fontRef: { $ref: '#/components/schemas/DesignAssetRef' }
        fontSizePt: { type: number, exclusiveMinimum: 0 }
        color:
          type: string
          pattern: '^#[0-9A-F]{8}$'
        decoration: { type: string, enum: [NONE, UNDERLINE, LINE_THROUGH] }
        letterSpacingPt: { type: number }
        letterSpacingFactor: { type: number }
    DesignLineHeight:
      oneOf:
        - $ref: '#/components/schemas/DesignFactorLineHeight'
        - $ref: '#/components/schemas/DesignFixedLineHeight'
      discriminator:
        propertyName: type
        mapping:
          FACTOR: '#/components/schemas/DesignFactorLineHeight'
          FIXED: '#/components/schemas/DesignFixedLineHeight'
    DesignFactorLineHeight:
      type: object
      additionalProperties: false
      required: [type, factor]
      properties:
        type: { type: string, const: FACTOR }
        factor: { type: number, exclusiveMinimum: 0 }
    DesignFixedLineHeight:
      type: object
      additionalProperties: false
      required: [type, valuePt]
      properties:
        type: { type: string, const: FIXED }
        valuePt: { type: number, exclusiveMinimum: 0 }
    DesignPathCommand:
      oneOf:
        - $ref: '#/components/schemas/DesignMoveToCommand'
        - $ref: '#/components/schemas/DesignLineToCommand'
        - $ref: '#/components/schemas/DesignQuadToCommand'
        - $ref: '#/components/schemas/DesignCubicToCommand'
        - $ref: '#/components/schemas/DesignCloseCommand'
      discriminator:
        propertyName: type
        mapping:
          MOVE_TO: '#/components/schemas/DesignMoveToCommand'
          LINE_TO: '#/components/schemas/DesignLineToCommand'
          QUAD_TO: '#/components/schemas/DesignQuadToCommand'
          CUBIC_TO: '#/components/schemas/DesignCubicToCommand'
          CLOSE: '#/components/schemas/DesignCloseCommand'
    DesignMoveToCommand:
      type: object
      additionalProperties: false
      required: [type, xMm, yMm]
      properties:
        type: { type: string, const: MOVE_TO }
        xMm: { type: number }
        yMm: { type: number }
    DesignLineToCommand:
      type: object
      additionalProperties: false
      required: [type, xMm, yMm]
      properties:
        type: { type: string, const: LINE_TO }
        xMm: { type: number }
        yMm: { type: number }
    DesignQuadToCommand:
      type: object
      additionalProperties: false
      required: [type, cxMm, cyMm, xMm, yMm]
      properties:
        type: { type: string, const: QUAD_TO }
        cxMm: { type: number }
        cyMm: { type: number }
        xMm: { type: number }
        yMm: { type: number }
    DesignCubicToCommand:
      type: object
      additionalProperties: false
      required: [type, c1xMm, c1yMm, c2xMm, c2yMm, xMm, yMm]
      properties:
        type: { type: string, const: CUBIC_TO }
        c1xMm: { type: number }
        c1yMm: { type: number }
        c2xMm: { type: number }
        c2yMm: { type: number }
        xMm: { type: number }
        yMm: { type: number }
    DesignCloseCommand:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: CLOSE }
    DesignTemplateRef:
      type: object
      additionalProperties: false
      required: [templateId]
      properties:
        templateId:
          $ref: '#/components/schemas/DesignUuidV4'
    DesignTemplateUseContextSelector:
      oneOf:
        - $ref: '#/components/schemas/DesignContextTemplateSelector'
        - $ref: '#/components/schemas/DesignEmptyTemplateSelector'
      discriminator:
        propertyName: kind
        mapping:
          context: '#/components/schemas/DesignContextTemplateSelector'
          empty: '#/components/schemas/DesignEmptyTemplateSelector'
    DesignContextTemplateSelector:
      type: object
      additionalProperties: false
      required: [kind, domain, contextAbsentPolicy]
      properties:
        kind: { type: string, const: context }
        domain:
          $ref: '#/components/schemas/DesignTemplateSelectorDomain'
        pointer:
          type: string
          pattern: '^(?:|/(?:[^~/]|~[01])+(?:/(?:[^~/]|~[01])*)*)$'
          maxLength: 1024
        contextAbsentPolicy: { type: string, enum: [ERROR, SKIP] }
    DesignEmptyTemplateSelector:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, const: empty }
    DesignTemplateSelectorDomain:
      oneOf:
        - $ref: '#/components/schemas/DesignInvocationSelectorDomain'
        - $ref: '#/components/schemas/DesignLoopSelectorDomain'
      discriminator:
        propertyName: kind
        mapping:
          invocation: '#/components/schemas/DesignInvocationSelectorDomain'
          loop: '#/components/schemas/DesignLoopSelectorDomain'
    DesignInvocationSelectorDomain:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, const: invocation }
    DesignLoopSelectorDomain:
      type: object
      additionalProperties: false
      required: [kind, loopId]
      properties:
        kind: { type: string, const: loop }
        loopId: { $ref: '#/components/schemas/DesignUuidV4' }
    DesignTemplateUseFill:
      type: object
      additionalProperties: false
      required: [targetDefinitionId, source]
      properties:
        targetDefinitionId:
          $ref: '#/components/schemas/DesignUuidV4'
        source:
          $ref: '#/components/schemas/DesignBindingSource'
    DesignNode:
      oneOf:
        - $ref: '#/components/schemas/DesignGroupNode'
        - $ref: '#/components/schemas/DesignFrameNode'
        - $ref: '#/components/schemas/DesignStackNode'
        - $ref: '#/components/schemas/DesignGridNode'
        - $ref: '#/components/schemas/DesignRepeatNode'
        - $ref: '#/components/schemas/DesignTextNode'
        - $ref: '#/components/schemas/DesignImageNode'
        - $ref: '#/components/schemas/DesignRectNode'
        - $ref: '#/components/schemas/DesignEllipseNode'
        - $ref: '#/components/schemas/DesignLineNode'
        - $ref: '#/components/schemas/DesignPolygonNode'
        - $ref: '#/components/schemas/DesignPolylineNode'
        - $ref: '#/components/schemas/DesignPathNode'
        - $ref: '#/components/schemas/DesignQrCodeNode'
        - $ref: '#/components/schemas/DesignBarcodeNode'
        - $ref: '#/components/schemas/DesignTemplateUseNode'
        - $ref: '#/components/schemas/DesignConditionalNode'
      discriminator:
        propertyName: kind
        mapping:
          group: '#/components/schemas/DesignGroupNode'
          frame: '#/components/schemas/DesignFrameNode'
          stack: '#/components/schemas/DesignStackNode'
          grid: '#/components/schemas/DesignGridNode'
          repeat: '#/components/schemas/DesignRepeatNode'
          text: '#/components/schemas/DesignTextNode'
          image: '#/components/schemas/DesignImageNode'
          rect: '#/components/schemas/DesignRectNode'
          ellipse: '#/components/schemas/DesignEllipseNode'
          line: '#/components/schemas/DesignLineNode'
