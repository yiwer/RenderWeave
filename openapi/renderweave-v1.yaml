openapi: 3.1.2
info:
  title: RenderWeave API
  version: 0.17.0
  description: >-
    Contract-first API for RenderWeave Schema Drafts, immutable StaticSchemas,
    exact compiled artifacts, owner-scoped active Template catalogs, dependency-checked
    Template revision authoring with bounded invalid-save confirmation, owner-scoped Asset
    upload/detail/catalog/versioning/delete-confirmation/restore, authoritative RootDocument
    validation, atomic single-image Rendering delivery, deterministic replay, guarded live
    inference Candidate review and create-only atomic Draft application.
servers:
  - url: /
tags:
  - name: System
    description: Operational endpoints used by local and deployment canaries.
  - name: Schema Drafts
    description: Mutable Schema definitions with append-only revisions.
  - name: Static Schemas
    description: Immutable, exact-version publication artifacts and system presets.
  - name: Templates
    description: Owner-scoped mutable Templates with immutable complete DesignDSL revisions.
  - name: Rendering
    description: Atomic formal Render and Authoritative Preview delivery through one evaluator and engine path.
  - name: Assets
    description: Owner-scoped admitted IMAGE/FONT Assets with immutable content versions.
  - name: RootDocument Validation
    description: Strict, deterministic batch validation against one frozen Schema graph.
  - name: Inference Runs
    description: Durable replay/live runs and optimistic Candidate review.
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Verify API and PostgreSQL readiness
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts:
    get:
      operationId: listDrafts
      tags: [Schema Drafts]
      summary: Page through active Schema Drafts, most recently updated first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ResourceSearch'
        - $ref: '#/components/parameters/DraftListSort'
      responses:
        '200':
          description: Active Draft summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftListResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    post:
      operationId: createDraft
      tags: [Schema Drafts]
      summary: Create a valid Schema Draft at revision 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              description: Canonical URL of the created Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    get:
      operationId: getDraft
      tags: [Schema Drafts]
      summary: Read the current saved revision of a Draft
      responses:
        '200':
          description: Current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    put:
      operationId: saveDraft
      tags: [Schema Drafts]
      summary: Append a complete Draft revision when expectedRevision is current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: New current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    delete:
      operationId: deleteDraft
      tags: [Schema Drafts]
      summary: Soft-delete an unreferenced Draft at the expected revision
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Draft soft-deleted and its outgoing projection deactivated.
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/revisions:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    get:
      operationId: listDraftRevisions
      tags: [Schema Drafts]
      summary: Page through immutable Draft revision summaries, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Revision summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/revisions/{revision}:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
      - $ref: '#/components/parameters/Revision'
    get:
      operationId: getDraftRevision
      tags: [Schema Drafts]
      summary: Read one immutable Draft revision, including for a deleted Draft
      responses:
        '200':
          description: Exact historical revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftRevisionResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/restore:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    post:
      operationId: restoreDraftRevision
      tags: [Schema Drafts]
      summary: Copy an old revision into a new active current revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDraftRequest'
      responses:
        '200':
          description: New current Draft snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/schema-drafts/{schemaKey}/copies:
    parameters:
      - $ref: '#/components/parameters/SchemaKey'
    post:
      operationId: copyDraft
      tags: [Schema Drafts]
      summary: Copy the observed current Draft into a new user Draft at revision 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDraftRequest'
      responses:
        '201':
          description: Draft copy created.
          headers:
            Location:
              description: Canonical URL of the new Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas:
    get:
      operationId: listStaticSchemas
      tags: [Static Schemas]
      summary: List immutable StaticSchemas, including system presets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ResourceSearch'
        - $ref: '#/components/parameters/StaticSchemaListSort'
        - $ref: '#/components/parameters/StaticSchemaOriginFilter'
      responses:
        '200':
          description: StaticSchema summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaListResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
    post:
      operationId: publishStaticSchema
      tags: [Static Schemas]
      summary: Publish the exact current Draft revision as an immutable StaticSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishStaticSchemaRequest'
      responses:
        '201':
          description: StaticSchema published with a stored compiled artifact.
          headers:
            Location:
              description: Canonical URL of the StaticSchema.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: getStaticSchema
      tags: [Static Schemas]
      summary: Read immutable StaticSchema metadata and DSL snapshot
      responses:
        '200':
          description: StaticSchema detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/definition:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: downloadStaticSchemaDefinition
      tags: [Static Schemas]
      summary: Download the immutable RenderWeave DSL snapshot
      responses:
        '200':
          description: Normalized RenderWeave DSL JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/compiled-json-schema:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    get:
      operationId: downloadCompiledJsonSchema
      tags: [Static Schemas]
      summary: Download the exact stored JSON Schema 2020-12 artifact bytes
      responses:
        '200':
          description: Fully inlined immutable JSON Schema artifact.
          content:
            application/schema+json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/static-schemas/{schemaKey}/{versionTag}/copies:
    parameters:
      - $ref: '#/components/parameters/StaticSchemaKey'
      - $ref: '#/components/parameters/VersionTag'
    post:
      operationId: copyStaticSchemaToDraft
      tags: [Static Schemas]
      summary: Copy one exact StaticSchema definition into a new user Draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDraftRequest'
      responses:
        '201':
          description: New Draft at revision 0.
          headers:
            Location:
              description: Canonical URL of the new Draft.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
  /api/v1/templates:
    get:
      operationId: listTemplates
      tags: [Templates]
      summary: Page through active Templates visible in the caller's owner scope
      description: >-
        Returns only safe current-revision summaries ordered by updatedAt descending and
        templateId ascending. The opaque cursor preserves that order across pages. Deleted,
        cross-owner and DesignDSL content are never disclosed by this catalog.
      parameters:
        - $ref: '#/components/parameters/TemplateSearch'
        - $ref: '#/components/parameters/TemplateCursor'
        - $ref: '#/components/parameters/TemplateLimit'
      responses:
        '200':
          description: Active Template summary page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/TemplateForbiddenProblem'
        '503':
          $ref: '#/components/responses/TemplateServiceUnavailableProblem'
    post:
      operationId: createTemplate
      tags: [Templates]
      summary: Create a Template at revision 0 from one complete admitted DesignDSL
      description: >-
        The DesignDSL bytes are the complete request body. ownerScope and Host capability are
        resolved exclusively from trusted server context and are not request fields. The currently
        admitted kernel is deliberately narrower than the unreleased full DesignDSL Profile.
        Create is strict: any dependency or hard problem rejects the request without a write.
      parameters:
        - $ref: '#/components/parameters/TemplateSchemaKey'
        - $ref: '#/components/parameters/TemplateVersionTag'
      requestBody:
        required: true
        content:
          application/vnd.renderweave.design+json:
            schema:
              $ref: '#/components/schemas/DesignDslKernel'
      responses:
        '201':
          description: Revision 0 committed; disclosure depends on the caller's independent read capability.
          headers:
            Location:
              description: Canonical URL of the created Template.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCommitResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/TemplateForbiddenProblem'
        '404':
          $ref: '#/components/responses/TemplateNotFoundProblem'
        '413':
          $ref: '#/components/responses/TemplatePayloadTooLargeProblem'
        '415':
          description: The body is not the exact DesignDSL media type.
        '422':
          $ref: '#/components/responses/TemplateAuthoringValidationProblem'
        '503':
          $ref: '#/components/responses/TemplateServiceUnavailableProblem'
  /api/v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: getTemplateCurrent
      tags: [Templates]
      summary: Read and integrity-check the active Template current revision
      description: >-
        The returned readiness is the persisted current-facing projection and is not a fresh
        editor or Render authorization conclusion. Editor open flows explicitly call the
        readiness-recheck operation and bind its result to revision plus contentHash.
      responses:
        '200':
          description: Canonical current editor baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateReadableResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/TemplateNotFoundProblem'
        '410':
          description: The authorized Template exists but is terminally deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/TemplateServiceUnavailableProblem'
    put:
      operationId: saveTemplate
      tags: [Templates]
      summary: Append a complete immutable DesignDSL revision if expectedRevision is current
      description: >-
        StaticSchema and ownerScope are permanent stored facts and cannot be supplied or rebound by
        this request. A same-content save still appends the next revision. Confirmable dependency
        errors first return a bounded complete problem set and a five-minute opaque token. Saving
        INVALID requires resubmitting the exact complete body and expectedRevision with that token;
        it is not a generic force flag. Content, current, dependency or expiry drift writes nothing
        and requires a fresh confirmation when the new state remains confirmable.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
        - $ref: '#/components/parameters/TemplateInvalidSaveConfirmationToken'
      requestBody:
        required: true
        content:
          application/vnd.renderweave.design+json:
            schema:
              $ref: '#/components/schemas/DesignDslKernel'
      responses:
        '200':
          description: The next immutable revision committed; disclosure remains capability-bounded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCommitResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/TemplateForbiddenProblem'
        '404':
          $ref: '#/components/responses/TemplateNotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/TemplatePayloadTooLargeProblem'
        '415':
          description: The body is not the exact DesignDSL media type.
        '422':
          $ref: '#/components/responses/TemplateAuthoringValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/TemplateServiceUnavailableProblem'
  /api/v1/templates/{templateId}/readiness-recheck:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      operationId: recheckTemplateReadiness
      tags: [Templates]
      summary: Explicitly recheck the latest active Template current against current dependencies
      description: >-
        Authorizes Template read, integrity-checks the latest canonical current, recomputes and
        persists READY or INVALID through a revision-guarded update, then returns the exact
        revision and contentHash checked. GET remains side-effect free. A repeatedly drifting
        current returns 409 and must be reopened; old results never overwrite a newer revision.
      responses:
        '200':
          description: Fresh readiness projection bound to one exact current identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateReadinessRecheckResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/TemplateNotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '410':
          description: The authorized Template exists but is terminally deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/TemplateServiceUnavailableProblem'
  /api/v1/templates/{templateId}/render:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/RenderFormat'
      - $ref: '#/components/parameters/RenderDpi'
      - $ref: '#/components/parameters/RenderJpegQuality'
      - $ref: '#/components/parameters/RenderContentEncoding'
    post:
      operationId: renderTemplate
      tags: [Rendering]
      summary: Atomically render one complete image from the saved Template current
      description: >-
        The server selects the formal-output purpose and exact certified compatibility profile.
        The caller supplies only a strict RenderInput body plus bounded output format, DPI and
        JPEG quality. Engine request identity, RenderDocument, leases and partial bytes are never
        public. The RenderWeave-Request-Id success header carries the public renderOperationId,
        never the Engine requestId. No successful response is persisted as an Artifact or history.
      requestBody:
        required: true
        content:
          'application/vnd.renderweave.render-input+json;version=1.0':
            schema:
              $ref: '#/components/schemas/RenderInput'
      responses:
        '200':
          $ref: '#/components/responses/RenderedImage'
        '400':
          $ref: '#/components/responses/RenderProblem'
        '403':
          $ref: '#/components/responses/RenderProblem'
        '404':
          $ref: '#/components/responses/RenderProblem'
        '409':
          $ref: '#/components/responses/RenderProblem'
        '413':
          $ref: '#/components/responses/RenderProblem'
        '415':
          $ref: '#/components/responses/RenderProblem'
        '422':
          $ref: '#/components/responses/RenderProblem'
        '500':
          $ref: '#/components/responses/RenderProblem'
        '502':
          $ref: '#/components/responses/RenderProblem'
        '503':
          $ref: '#/components/responses/RenderProblem'
        '504':
          $ref: '#/components/responses/RenderProblem'
  /api/v1/templates/{templateId}/authoritative-preview:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/RenderFormat'
      - $ref: '#/components/parameters/RenderDpi'
      - $ref: '#/components/parameters/RenderJpegQuality'
      - $ref: '#/components/parameters/RenderContentEncoding'
    post:
      operationId: createAuthoritativeTemplatePreview
      tags: [Rendering]
      summary: Atomically render an Authoritative Preview of the saved Template current
      description: >-
        The server fixes the Authoritative Preview purpose, which requires both template.read and
        template.render. This operation otherwise uses the same Evaluation, certified profile and
        RenderEngine path as formal output. It accepts no unsaved DesignDSL, local canvas,
        caller-selected profile, placeholder, stale result, LayoutTrace or Engine control value.
      requestBody:
        required: true
        content:
          'application/vnd.renderweave.render-input+json;version=1.0':
            schema:
              $ref: '#/components/schemas/RenderInput'
      responses:
        '200':
          $ref: '#/components/responses/RenderedImage'
        '400':
          $ref: '#/components/responses/RenderProblem'
        '403':
          $ref: '#/components/responses/RenderProblem'
        '404':
          $ref: '#/components/responses/RenderProblem'
        '409':
          $ref: '#/components/responses/RenderProblem'
        '413':
          $ref: '#/components/responses/RenderProblem'
        '415':
          $ref: '#/components/responses/RenderProblem'
        '422':
          $ref: '#/components/responses/RenderProblem'
        '500':
          $ref: '#/components/responses/RenderProblem'
        '502':
          $ref: '#/components/responses/RenderProblem'
        '503':
          $ref: '#/components/responses/RenderProblem'
        '504':
          $ref: '#/components/responses/RenderProblem'
  /api/v1/assets:
    post:
      operationId: createAsset
      tags: [Assets]
      summary: Admit and create one Asset at content version 0 from an uploaded IMAGE/FONT file
      description: >-
        The multipart request carries kind, displayName, optional tags and sourceFileName plus
        the raw content bytes. ownerScope and Host capability are resolved exclusively from
        trusted server context and are not request fields. The same Idempotency-Key within
        24 hours replays the original result for identical input and conflicts for different
        input. Multi-select uploads are independent creates and may partially succeed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, displayName, content]
              properties:
                kind:
                  type: string
                  enum: [IMAGE, FONT]
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                tags:
                  type: array
                  maxItems: 20
                  description: Repeated form parts; each is 1-64 Unicode scalars.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                sourceFileName:
                  type: string
                  maxLength: 255
                content:
                  type: string
                  format: binary
                  description: >-
                    Raw IMAGE (PNG/JPEG/WebP, at most 64 MiB) or FONT (TTF/OTF, at most 32 MiB)
                    bytes admitted by renderweave-asset-acceptance/1.0.
      responses:
        '201':
          description: Content version 0 committed; disclosure depends on the caller's independent read capability.
          headers:
            Location:
              description: Canonical URL of the created Asset.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCommitResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/AssetForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
