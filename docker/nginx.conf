server {
    listen 80;
    server_name _;

    error_page 413 = @payload_too_large;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Keep the transport proxy slightly above Spring's 34 MiB multipart
        # ceiling so the application owns the stable API Problem response.
        client_max_body_size 35m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-RenderWeave-Actor-Id "";
        proxy_set_header X-RenderWeave-Request-Id "";
        proxy_set_header X-RenderWeave-Gateway-Jti "";
    }

    location @payload_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Inference payload too large","status":413,"code":"INFERENCE_PAYLOAD_TOO_LARGE","traceId":"nginx-gateway","detail":"The multipart payload exceeds the bounded inference transport limit."}';
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
