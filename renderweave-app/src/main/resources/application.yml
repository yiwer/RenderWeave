spring:
  application:
    name: renderweave-api
  datasource:
    url: ${RENDERWEAVE_DB_URL:jdbc:postgresql://localhost:5432/renderweave}
    username: ${RENDERWEAVE_DB_USERNAME:renderweave}
    password: ${RENDERWEAVE_DB_PASSWORD:renderweave}
    hikari:
      # 10 active desktop sessions + 2 inference lanes + bounded operational headroom.
      maximum-pool-size: ${RENDERWEAVE_DB_MAX_POOL_SIZE:16}
      minimum-idle: ${RENDERWEAVE_DB_MIN_IDLE:2}
  flyway:
    enabled: true
    placeholder-replacement: false
  servlet:
    multipart:
      # Keep transport slightly above the authoritative 10 MiB item / 32 MiB batch limits.
      max-file-size: 11MB
      max-request-size: 34MB
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

renderweave:
  inference:
    blob-root: ${RENDERWEAVE_BLOB_ROOT:./var/renderweave/blobs}
    live-enabled: ${RENDERWEAVE_LIVE_AI_ENABLED:false}
    live-upload-enabled: ${RENDERWEAVE_LIVE_UPLOAD_ENABLED:false}
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    live-lease-seconds: 600
    recovery-enabled: ${RENDERWEAVE_INFERENCE_RECOVERY_ENABLED:true}
    live-poll-millis: 2000
    poll-initial-delay-millis: 2000
    document-vision:
      enabled: ${RENDERWEAVE_DOCUMENT_VISION_ENABLED:false}
      executable: ${RENDERWEAVE_DOCUMENT_VISION_EXECUTABLE:}
      adapter-script: ${RENDERWEAVE_DOCUMENT_VISION_ADAPTER_SCRIPT:}
      model-root: ${RENDERWEAVE_DOCUMENT_VISION_MODEL_ROOT:}
      timeout-seconds: ${RENDERWEAVE_DOCUMENT_VISION_TIMEOUT_SECONDS:30}
      expected-capability-id: ${RENDERWEAVE_DOCUMENT_VISION_CAPABILITY_ID:rapidocr-3.9.2-openvino-2026.0.0-ppocrv6-small-c05805399d7d10b1}
