spring:
  application:
    name: renderweave-api
  datasource:
    url: ${RENDERWEAVE_DB_URL:jdbc:postgresql://localhost:5432/renderweave}
    username: ${RENDERWEAVE_DB_USERNAME:renderweave}
    password: ${RENDERWEAVE_DB_PASSWORD:renderweave}
    hikari:
      # 10 active desktop sessions + 2 inference lanes + bounded operational headroom.
      maximum-pool-size: ${RENDERWEAVE_DB_MAX_POOL_SIZE:16}
      minimum-idle: ${RENDERWEAVE_DB_MIN_IDLE:2}
  flyway:
    enabled: true
    placeholder-replacement: false
  servlet:
    multipart:
      # Transport is sized slightly above the authoritative Asset single-item admission
      # limit (64 MiB images / 32 MiB fonts); per-endpoint authoritative budgets
      # (Asset admission, inference 10 MiB item / 32 MiB batch) are enforced in controllers.
      max-file-size: 65MB
      max-request-size: 66MB
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  ssl:
    enabled: ${RENDERWEAVE_API_MTLS_ENABLED:false}
    client-auth: ${RENDERWEAVE_API_MTLS_CLIENT_AUTH:need}
    key-store: ${RENDERWEAVE_API_MTLS_KEY_STORE:}
    key-store-password: ${RENDERWEAVE_API_MTLS_KEY_STORE_PASSWORD:}
    trust-store: ${RENDERWEAVE_API_MTLS_TRUST_STORE:}
    trust-store-password: ${RENDERWEAVE_API_MTLS_TRUST_STORE_PASSWORD:}

management:
  server:
    address: ${RENDERWEAVE_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${RENDERWEAVE_MANAGEMENT_PORT:9090}
    ssl:
      enabled: ${RENDERWEAVE_MANAGEMENT_MTLS_ENABLED:false}
      client-auth: ${RENDERWEAVE_MANAGEMENT_MTLS_CLIENT_AUTH:need}
      key-store: ${RENDERWEAVE_MANAGEMENT_MTLS_KEY_STORE:}
      key-store-password: ${RENDERWEAVE_MANAGEMENT_MTLS_KEY_STORE_PASSWORD:}
      trust-store: ${RENDERWEAVE_MANAGEMENT_MTLS_TRUST_STORE:}
      trust-store-password: ${RENDERWEAVE_MANAGEMENT_MTLS_TRUST_STORE_PASSWORD:}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

renderweave:
  template:
    stale-consumer:
      enabled: ${RENDERWEAVE_TEMPLATE_STALE_CONSUMER_ENABLED:true}
      delay-ms: ${RENDERWEAVE_TEMPLATE_STALE_CONSUMER_DELAY_MS:5000}
    single-owner:
      # Development/test host adapter only. Production remains fail-closed by default.
      enabled: ${RENDERWEAVE_TEMPLATE_SINGLE_OWNER_ENABLED:false}
      owner-scope: ${RENDERWEAVE_TEMPLATE_SINGLE_OWNER_SCOPE:}
      capabilities: ${RENDERWEAVE_TEMPLATE_SINGLE_OWNER_CAPABILITIES:}
  asset:
    single-owner:
      # Development/test host adapter only. Production remains fail-closed by default.
      enabled: ${RENDERWEAVE_ASSET_SINGLE_OWNER_ENABLED:false}
      owner-scope: ${RENDERWEAVE_ASSET_SINGLE_OWNER_SCOPE:}
      capabilities: ${RENDERWEAVE_ASSET_SINGLE_OWNER_CAPABILITIES:}
    capacity:
      hard-limit-bytes: ${RENDERWEAVE_ASSET_CAPACITY_HARD_LIMIT_BYTES:107374182400}
    idempotency:
      ttl: ${RENDERWEAVE_ASSET_IDEMPOTENCY_TTL:PT24H}
    s3:
      endpoint: ${RENDERWEAVE_ASSET_S3_ENDPOINT:}
      region: ${RENDERWEAVE_ASSET_S3_REGION:us-east-1}
      bucket: ${RENDERWEAVE_ASSET_S3_BUCKET:renderweave-assets}
      access-key: ${RENDERWEAVE_ASSET_S3_ACCESS_KEY:}
      secret-key: ${RENDERWEAVE_ASSET_S3_SECRET_KEY:}
      path-style: ${RENDERWEAVE_ASSET_S3_PATH_STYLE:true}
  security:
    gateway-assertion:
      enabled: ${RENDERWEAVE_GATEWAY_ASSERTION_ENABLED:false}
      issuer: ${RENDERWEAVE_GATEWAY_ASSERTION_ISSUER:}
      audience: ${RENDERWEAVE_GATEWAY_ASSERTION_AUDIENCE:}
      public-key-directory: ${RENDERWEAVE_GATEWAY_ASSERTION_PUBLIC_KEY_DIRECTORY:}
    gateway-mtls:
      required: ${RENDERWEAVE_GATEWAY_MTLS_REQUIRED:true}
      allowed-certificate-sha256: ${RENDERWEAVE_GATEWAY_MTLS_CERTIFICATE_SHA256:}
    actuator-mtls:
      required: ${RENDERWEAVE_ACTUATOR_MTLS_REQUIRED:true}
      allowed-certificate-sha256: ${RENDERWEAVE_ACTUATOR_MTLS_CERTIFICATE_SHA256:}
  inference:
    payload-lifecycle:
      enabled: ${RENDERWEAVE_PAYLOAD_LIFECYCLE_ENABLED:false}
      batch-size: ${RENDERWEAVE_PAYLOAD_LIFECYCLE_BATCH_SIZE:100}
      interval-ms: ${RENDERWEAVE_PAYLOAD_LIFECYCLE_INTERVAL_MS:5000}
      initial-delay-ms: ${RENDERWEAVE_PAYLOAD_LIFECYCLE_INITIAL_DELAY_MS:5000}
    blob-root: ${RENDERWEAVE_BLOB_ROOT:./var/renderweave/blobs}
    envelope-encryption:
      enabled: ${RENDERWEAVE_BLOB_ENVELOPE_ENCRYPTION_ENABLED:false}
      kek-directory: ${RENDERWEAVE_BLOB_KEK_DIRECTORY:}
      current-kek-id: ${RENDERWEAVE_BLOB_CURRENT_KEK_ID:}
    live-enabled: ${RENDERWEAVE_LIVE_AI_ENABLED:false}
    live-upload-enabled: ${RENDERWEAVE_LIVE_UPLOAD_ENABLED:false}
    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    live-lease-seconds: 600
    recovery-enabled: ${RENDERWEAVE_INFERENCE_RECOVERY_ENABLED:true}
    live-poll-millis: 2000
    poll-initial-delay-millis: 2000
    document-vision:
      enabled: ${RENDERWEAVE_DOCUMENT_VISION_ENABLED:false}
      executable: ${RENDERWEAVE_DOCUMENT_VISION_EXECUTABLE:}
      adapter-script: ${RENDERWEAVE_DOCUMENT_VISION_ADAPTER_SCRIPT:}
      model-root: ${RENDERWEAVE_DOCUMENT_VISION_MODEL_ROOT:}
      timeout-seconds: ${RENDERWEAVE_DOCUMENT_VISION_TIMEOUT_SECONDS:30}
      expected-capability-id: ${RENDERWEAVE_DOCUMENT_VISION_CAPABILITY_ID:rapidocr-3.9.2-openvino-2026.0.0-ppocrv6-small-c05805399d7d10b1}
