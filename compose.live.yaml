services:
  api:
    environment:
      DASHSCOPE_TOKEN_API_KEY_FILE: /run/secrets/dashscope_api_key
      RENDERWEAVE_LIVE_AI_ENABLED: "true"
      RENDERWEAVE_LIVE_UPLOAD_ENABLED: "true"
    secrets:
      - dashscope_api_key

secrets:
  dashscope_api_key:
    environment: DASHSCOPE_TOKEN_API_KEY
