name: renderweave

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: renderweave
      POSTGRES_USER: renderweave
      POSTGRES_PASSWORD: renderweave-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderweave -d renderweave"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - renderweave-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renderweave-assets
      MINIO_ROOT_PASSWORD: renderweave-local-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - renderweave-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set renderweave http://minio:9000 renderweave-assets renderweave-local-only &&
        mc mb --ignore-existing renderweave/renderweave-assets
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      RENDERWEAVE_DB_URL: jdbc:postgresql://postgres:5432/renderweave
      RENDERWEAVE_DB_USERNAME: renderweave
      RENDERWEAVE_DB_PASSWORD: renderweave-local-only
      RENDERWEAVE_BLOB_ROOT: /var/lib/renderweave/blobs
      RENDERWEAVE_ASSET_S3_ENDPOINT: http://minio:9000
      RENDERWEAVE_ASSET_S3_ACCESS_KEY: renderweave-assets
      RENDERWEAVE_ASSET_S3_SECRET_KEY: renderweave-local-only
      RENDERWEAVE_ASSET_S3_BUCKET: renderweave-assets
      RENDERWEAVE_INFERENCE_DOCUMENT_VISION_ENABLED: "true"
      RENDERWEAVE_INFERENCE_DOCUMENT_VISION_UD_SOCKET: /run/ocr/document-vision.sock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - renderweave-blobs:/var/lib/renderweave/blobs
      - renderweave-ocr-socket:/run/ocr

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

  ocr-sidecar:
    build:
      context: docker/ocr-sidecar
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    tmpfs:
      - /tmp:size=64m
    volumes:
      - renderweave-ocr-socket:/run/ocr

volumes:
  renderweave-postgres:
  renderweave-blobs:
  renderweave-minio:
  renderweave-ocr-socket:
