[workspace]
members = ["crates/protocol", "crates/document", "crates/layout", "crates/output-png", "crates/output-jpeg", "crates/resource", "crates/engine", "crates/daemon"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Proprietary"

[workspace.dependencies]
hex = "=0.4.3"
image-webp = "=0.2.4"
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
